- insert:
    - id: muse-drama-web
      name: muse-drama-web
      config:
        baseUrl: http://drama-web.jubianai.net/api/v1
        # The host owns the value; the plugin only names the variable.
        tokenEnv: DRAMA_WEB_TOKEN
        usernameEnv: DRAMA_WEB_USERNAME
        passwordEnv: DRAMA_WEB_PASSWORD
