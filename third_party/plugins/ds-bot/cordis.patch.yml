# Muse owns model routes, web search, account access and runtime updates.
- insert:
    - id: muse-bot
      name: ds-bot
      config:
        agentPreset: short-drama
        mainAgentPreset: bot-coordinator
        contextManagement: host
        goals: host
        memoryReview: true
        autoSessionBots: true
        sessionBotSyncIntervalMs: 30000
        github: false
        updateCheck: false
