# Start the SDK server after the fixture has admitted its local account session.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none
- id: tool-workflow
  disabled: true
- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: llm-deepseek
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: time-context
  disabled: true
- id: sdk-jsonrpc-server
  inject: [sdkAppStartup, loader, snapshotProviderFailoverReady]
- insert:
    - id: snapshot-selected-account-models
      name: '../../session/muse-selected-account-models/account-fixture.mjs'
