# TypeScript SDK snapshot-record patch over `dsh --profile sdk`.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1

# The process-local clock is deterministic; native timers remain live.
- insert:
    - id: snapshot-clock
      name: './clock.mjs'

- id: time-context
  config:
    timeZone: UTC

# The recorded tool catalog includes the optional patch tool.
- id: tool-fs
  config:
    applyPatch: true

- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: sdk-jsonrpc-server
  inject: [sdkAppStartup, loader, snapshotSkillFeedbackReady]
- insert:
    - id: muse-skill-feedback-fixture
      name: './runtime.mjs'
