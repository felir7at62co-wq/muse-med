# SDK protocol fixtures use Bash and a deterministic sandbox runner on every
# platform. Native confinement behavior has separate sandbox-provider coverage.

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: false

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: true

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: false

- id: pwsh-sandbox
  name: '@deepseek-ai/dsh-pwsh-sandbox'
  disabled: true

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
