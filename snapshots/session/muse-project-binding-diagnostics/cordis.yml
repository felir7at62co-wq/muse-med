# This replay exercises local validation without shell, provider traffic or credentials.
- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: binding-fixture
      name: './binding-fixture.mjs'
    - id: tool-jubian
      name: '../../../packages/jubian/tool-jubian/tests/snapshot-plugin.mjs'
      config:
        baseUrl: https://project-binding.invalid/prod-api
        workspaceSecrets: false
