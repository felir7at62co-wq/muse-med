# Proactive compaction with a bounded message budget.

- id: llm-deepseek
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 9250
        maxTokens: 1000

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: pressure-compaction-fixture
      name: ./pressure-fixture.mjs

# Pressure depends on the dialogue, not the temporary working-directory length.
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- id: bash-sandbox
  disabled: false
- id: tool-bash
  disabled: false
- id: pwsh-sandbox
  disabled: true
- id: tool-pwsh
  disabled: true
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
