# Desktop's Web bundle keeps these Host-level tools disabled.
- id: plan-mode
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

# Record with a keyless observer while mounting the real Muse editing preset clock.
- id: llm-deepseek
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: editing
    - id: snapshot-editing-preset
      name: '../muse-editing-tool-catalog/editing-preset-fixture.mjs'
      config:
        hidePlatformShellTools: true
        keepClock: true
    - id: snapshot-muse-clock
      name: './clock-fixture.ts'

# This owner checks tools or clock messages, not the platform-specific sandbox skill.
# No shell call is made; the fixture runner keeps discovery identical across platforms.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
