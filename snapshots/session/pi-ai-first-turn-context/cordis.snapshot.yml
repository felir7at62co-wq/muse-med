- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

# Match the shared keyless composition without introducing a Windows ACL skill catalog.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: first-turn-context-check
      name: './context-check.mjs'
