- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                toolUpdate: in-history
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: high
    - id: discovery
      name: '../../../apps/desktop/tests/fixtures/resident-discovery.mjs'
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: short-drama
    - id: product-preset
      name: '../muse-editing-tool-catalog/editing-preset-fixture.mjs'
      config:
        presetId: short-drama
        hidePlatformShellTools: true
    - id: local-douyin-fixture
      name: './fixture.mjs'

# The headless case does not consume generated Typert endpoints.
- id: typert-loader
  disabled: true
