# This scenario exercises native business tools, not a platform shell.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: generate-alias-fixture
      name: './generate-alias-fixture.mjs'
    - id: tool-jubian
      name: './jubian-plugin.mjs'
      config:
        baseUrl: https://generate-alias.invalid/prod-api
        workspaceSecrets: false
        sessionVideoSelection: true
        defaultVideoModel:
          modelId: doubao-seedance-2-5-260628
          platformId: FANG_ZHOU
          resolution: 480p
