- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
- id: headless-runner
  inject: [headlessStartup, snapshotVisualizeReady]
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: short-drama
    - id: snapshot-visualize
      name: './visualize-fixture.mjs'
