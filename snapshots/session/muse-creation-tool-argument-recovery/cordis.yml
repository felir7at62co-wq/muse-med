# Mount the actual creation preset with both platform shells hidden for portability.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: creation
    - id: snapshot-creation-preset
      name: './creation-preset-fixture.mjs'

# Keep unrelated host stack locations out of this argument-diagnostic replay.
- id: ptc-runtime
  config:
    bootstrapPath: !!js >-
      process.cwd() + '/ptc-binding-bootstrap.mjs'
