- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: source-recovery-fixture
      name: './source-recovery-fixture.mjs'

- id: tool-result-pruner
  config:
    thresholdChars: 180
    headChars: 60
    tailChars: 40
