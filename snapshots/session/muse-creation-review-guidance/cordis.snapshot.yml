# Replay the actual product creation preset with the recorded model frames.
- id: llm-deepseek
  disabled: true

- insert:
    - id: read-snapshot-version
      name: '../../../packages/fs/tool-fs/tests/fixtures/read-snapshot-version.mjs'
      config:
        files: [.dsh/skills/screenplay-format/references/writing-quality.md]
        maxBytes: 8192
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: creation
    - id: snapshot-creation-preset
      name: './creation-preset-fixture.mjs'

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
