- id: llm-deepseek
  disabled: true
- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: snapshot-background-completion-notification
      name: './notification-fixture.mjs'
