- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: tool-episode-render
      name: './renderer-fixture.mjs'
      config:
        ffmpegPath: subtitle-visual-fixture-ffmpeg
        ffprobePath: subtitle-visual-fixture-ffprobe
        preferNvenc: false
        fontsDir: ''
    - id: subtitle-visual-session-media-fixture
      name: './media-fixture.mjs'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

- id: skill
  name: '@deepseek-ai/dsh-skill'
  disabled: true
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: true
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: true
