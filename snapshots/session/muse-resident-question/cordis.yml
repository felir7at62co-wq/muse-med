# This resident UI replay does not execute a shell. Pin its unused runner so
# discovery has the same skill catalog on Windows and POSIX.
- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: typert-loader
  disabled: true
- insert:
    - id: resident-bot-questions
      name: '../../../apps/desktop/tests/fixtures/resident-bot-questions.mjs'
    - id: resident-discovery
      name: '../../../apps/desktop/tests/fixtures/resident-discovery.mjs'
      config:
        legacyBotTools: true
