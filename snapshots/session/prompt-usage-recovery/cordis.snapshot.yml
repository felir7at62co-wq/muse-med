# Discard one reply whose reported prompt is far below the request, then retry it under the route policy.
# Keep this failure oracle independent of bundled operating-system skills.
# This zero-dispatch guard owner does not test Sandbox backends.
# The unused operator sentinel avoids OS skills; accidental process dispatch must fail.
- id: sandbox
  config:
    runnerCommand: [operator-runner]
    runnerFailureSignatures: [operator runner unavailable]

- id: skill-filesystem
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            retryPolicy:
              mode: normal
              maxRetries: 1
              retryableCodes: [EMPTY_RESPONSE, INVALID_TOOL_ARGUMENTS, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, PROMPT_USAGE_SHORTFALL]
              backoff:
                initialDelayMs: 1
                maxDelayMs: 1
                jitterRatio: 0
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: prompt-usage-guard
      name: ./guard-fixture.mjs
      config:
        routes:
          - { provider: deepseek-official, model: deepseek-v4-flash, minToolSchemaRatio: 1.0, minEstimateRatio: 0.5 }

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
