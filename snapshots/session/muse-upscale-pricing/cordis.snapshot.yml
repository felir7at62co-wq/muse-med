- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
# This pricing scenario never executes shell commands or loads platform skills.
- id: sandbox
  config:
    runnerCommand: !!js "[process.execPath, '-e', 'process.exit(1)']"
    runnerFailureSignatures:
      - snapshot-shell-disabled
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: drama-settings
      name: './drama-plugin.mjs'
    - id: upscale-fixture
      name: './upscale-fixture.mjs'
    - id: tool-jubian
      name: './jubian-plugin.mjs'
      config:
        baseUrl: https://upscale-pricing.invalid/prod-api
        workspaceSecrets: false
