- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: false
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: false
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: manuscript-fixture
      name: '../muse-manuscript-user-revisions/manuscript-fixture.mjs'
      config:
        correctionTool: pwsh
