# The scenario reads settings; keep unused sandbox and shell metadata platform-independent.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: skill-filesystem
  disabled: true

- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
    - id: draft-root-answer
      name: './draft-root-fixture.mjs'

- id: drama-settings
  name: '@deepseek-ai/dsh-drama-settings'
