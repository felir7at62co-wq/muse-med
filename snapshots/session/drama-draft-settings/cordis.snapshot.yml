# Keep the same platform-independent tool menu as the authored composition.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: skill-filesystem
  disabled: true

- id: llm-deepseek
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
- insert:
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'
    - id: draft-root-answer
      name: './draft-root-fixture.mjs'

- id: drama-settings
  name: '@deepseek-ai/dsh-drama-settings'
