- id: tool-workflow
  disabled: true
# Pin an unused runner so this shell-free fixture has the same skill catalog on every platform.
- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
# Recorded model messages replay through the actual account adapter and HTTP stream parser.
- id: llm-deepseek
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: snapshot-selected-account-models
      name: './account-fixture.mjs'
