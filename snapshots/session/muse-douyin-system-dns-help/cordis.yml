# Tool discovery only; the recorded response performs no media requests.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: muse-hongguo-download
      name: '../../../third_party/plugins/muse-hongguo-download/src/index.js'
    - id: muse-douyin-download
      name: '../../../third_party/plugins/muse-douyin-download/src/index.js'
      config:
        pythonExecutable: !!js process.execPath
        ffprobeExecutable: !!js process.execPath
        ffmpegExecutable: !!js process.execPath
        settingsHome: !!js process.env.DSH_HOME

- id: subprocess
  disabled: true
- insert:
    - id: snapshot-douyin-blocked-transport
      name: './transport-fixture.mjs'

# Durable task IDs include the real owning Session; the normal runner resumes this fixture-owned header.
- id: headless-runner
  inject: [headlessStartup, douyinReplayOwnerReady]
  config:
    task: !!js ctx.headlessStartup.task
    sessionId: snapshot-douyin-system-dns-help
    json: !!js ctx.headlessStartup.json
