# Proactive compaction with a bounded message budget.

- id: llm-deepseek
  config:
    models:
      - id: deepseek-v4-flash
        contextWindow: 9210
        maxTokens: 1000

- id: compaction-basic
  config:
    thresholdRatio: 0.8
    headroomTokens: 1800
    retainTokens: 20

- insert:
    - id: pressure-compaction-fixture
      name: ../compaction-output-reserve/pressure-fixture.mjs
