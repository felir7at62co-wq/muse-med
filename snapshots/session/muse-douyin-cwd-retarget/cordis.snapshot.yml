- id: llm-deepseek
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: subprocess
  disabled: true
- id: headless-runner
  inject: [headlessStartup, snapshotDouyinCwdReady]
  config:
    task: !!js ctx.headlessStartup.task
    sessionId: snapshot-douyin-cwd-retarget
    json: !!js ctx.headlessStartup.json
- insert:
    - id: douyin-cwd-retarget-fixture
      name: ./fixture.mjs
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
