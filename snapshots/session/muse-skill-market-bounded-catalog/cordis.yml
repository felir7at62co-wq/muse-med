- id: llm-deepseek
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: bounded-market-fixture
      name: ./catalog-fixture.mjs
      config:
        executor: native
- id: tool-skill
  config:
    catalogSourceLimits:
      muse-market: 2
    catalogPageSize: 2
