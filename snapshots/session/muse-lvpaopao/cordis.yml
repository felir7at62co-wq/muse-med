- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: subprocess
  disabled: true
- insert:
    - id: offline-lvpaopao-subprocess
      name: './subprocess-fixture.mjs'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: lvpaopao-bridge
      name: './bridge-plugin.mjs'
      config:
        connectionFile: !!js ctx.dshHomePath('lvpaopao', 'connection.json')
        maxQueuedRequests: 4
    - id: lvpaopao-consumer
      name: './consumer-plugin.mjs'
