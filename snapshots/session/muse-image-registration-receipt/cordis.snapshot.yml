- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: image-registration-fixture
      name: ./image-registration-fixture.mjs
    - id: tool-jubian
      name: '../../../packages/jubian/tool-jubian/tests/snapshot-plugin.mjs'
      config:
        baseUrl: https://image-registration.invalid/prod-api
        workspaceSecrets: false
        ledgerRoot: !!js "process.cwd() + '/.dsh/image-registration-ledger'"
