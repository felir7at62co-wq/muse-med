# The real audio tools run against an isolated, free provider fixture.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: audio-binding-fixture
      name: './audio-binding-fixture.mjs'
    - id: tool-jubian
      name: './jubian-plugin.mjs'
      config:
        baseUrl: https://audio-binding.invalid/prod-api
        workspaceSecrets: false
