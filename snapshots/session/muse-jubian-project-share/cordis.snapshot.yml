- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  name: './skill-filesystem.mjs'
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
    - id: project-share-fixture
      name: './project-share-fixture.mjs'
    - id: tool-jubian
      name: './jubian-plugin.mjs'
      config:
        baseUrl: https://project-share.invalid/prod-api
        workspaceSecrets: false
