- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: llm-deepseek
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- insert:
    - id: tool-episode-render
      name: ./renderer-fixture.mjs
      config:
        ffmpegPath: subtitle-ass-ms-fixture-ffmpeg
        ffprobePath: subtitle-ass-ms-fixture-ffprobe
        normalizeSubtitleText: true
        preferNvenc: false
        fontsDir: ''
    - id: subtitle-ass-ms-media-fixture
      name: ./media-fixture.mjs
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
