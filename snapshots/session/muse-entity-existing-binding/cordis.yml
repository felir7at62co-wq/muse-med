- id: llm-deepseek
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: match-preview-http-fixture
      name: './matching-fixture.mjs'
    - id: tool-drama-assets
      name: '../../../packages/drama/tool-drama-assets/src/index.ts'
      config:
        baseUrl: https://match-preview.invalid/prod-api
        workspaceSecrets: false
    - id: tool-jubian
      name: '../../../packages/jubian/tool-jubian/src/index.ts'
      config:
        baseUrl: https://match-preview.invalid/prod-api
        workspaceSecrets: false

# This scenario loads only its workspace skills and no checkout instructions.
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.cwd() + '/.dsh/skills']"
    watch: false
