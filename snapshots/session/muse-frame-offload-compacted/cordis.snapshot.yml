- id: llm-deepseek
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text, image]
    - id: tool-video-inspect
      name: '@deepseek-ai/dsh-tool-video-inspect'
      config:
        requireCompleteReview: true
        offloadObservedFrames: true
    - id: compacted-frame-fixture
      name: './fixture.mjs'
