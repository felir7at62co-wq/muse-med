# Replay the LLM and cloud catalogue; BGM matching and composition remain real.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

# Official-API request metadata is not part of the keyless replay adapter.
- id: plugin-package-inventory-deepseek
  disabled: true

- insert:
    - id: bgm-numbered-catalog-fixture
      name: './catalog-fixture.mjs'
    - id: perception-bgm
      name: '@deepseek-ai/dsh-perception-bgm'
      config:
        catalogUrl: https://bgm-snapshot.example/bgm/catalog.json
    - id: tool-bgm-compose
      name: '@deepseek-ai/dsh-tool-bgm-compose'
      config:
        ffmpegPath: must-not-run-ffmpeg
        ffprobePath: must-not-run-ffprobe
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

- id: agent-instructions
  disabled: true
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.cwd() + '/.dsh/skills']"
    watch: false
