- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: credentials
  disabled: false
  config:
    watch: false
- insert:
    - id: snapshot-view-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: 127.0.0.1
        port: 0
    - id: snapshot-view-connection
      name: '@deepseek-ai/dsh-client-connection'
    - id: snapshot-view-workspace
      name: '@deepseek-ai/dsh-workspace'
    - id: snapshot-view-file-upload
      name: '@deepseek-ai/dsh-client-file-upload'
    - id: snapshot-view-session-controller
      name: '@deepseek-ai/dsh-api-session-controller'
    - id: snapshot-native-question
      name: '@deepseek-ai/dsh-tool-ask-user'
    - id: snapshot-deep-view
      name: '../../../third_party/plugins/deep-view/index.js'
    - id: snapshot-session-views
      name: './views-fixture.mjs'
