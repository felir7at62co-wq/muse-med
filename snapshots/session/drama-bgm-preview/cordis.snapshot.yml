# This shell-free replay pins an unused runner so its skill catalog is platform-independent.
- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]

# This scenario validates BGM inputs, not the platform's shell tool schema.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

# Keyless replay keeps the BGM composition intact and replaces only the model adapter.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: tool-bgm-compose
      name: '@deepseek-ai/dsh-tool-bgm-compose'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

# This owner checks tools or clock messages, not the platform-specific sandbox skill.
# No shell call is made; the fixture runner keeps discovery identical across platforms.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
