# This authored recovery case must only run keyless replay/refresh.
# Keep this failure oracle independent of bundled operating-system skills.
# This zero-dispatch argument-loop owner does not test Sandbox backends.
# The unused operator sentinel avoids OS skills; accidental process dispatch must fail.
- id: sandbox
  config:
    runnerCommand: [operator-runner]
    runnerFailureSignatures: [operator runner unavailable]

- id: skill-filesystem
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: tool-argument-loop
      name: ./guard-fixture.mjs
      config:
        repeatedPropertyLimit: 64
        recoveryAttempts: 1

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
