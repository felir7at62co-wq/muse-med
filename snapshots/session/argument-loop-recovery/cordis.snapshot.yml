# Recover one locally detected malformed response, independently of provider retry policy.
# Keep this failure oracle independent of bundled operating-system skills.
- id: skill-filesystem
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            retryPolicy:
              mode: always
              backoff:
                initialDelayMs: 1
                maxDelayMs: 1
                jitterRatio: 0
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
    - id: tool-argument-loop
      name: ./guard-fixture.mjs
      config:
        repeatedPropertyLimit: 64
        recoveryAttempts: 1

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
