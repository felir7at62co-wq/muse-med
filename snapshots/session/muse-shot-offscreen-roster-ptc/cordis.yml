- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: llm-deepseek
  disabled: true
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-skill
  disabled: true
- insert:
    - id: tool-shot-script
      name: '../../../packages/drama/tool-shot-script/tests/snapshot-plugin.mjs'
      config:
        reviewMode: advisory
    - id: offscreen-roster-observer
      name: ../muse-shot-offscreen-roster/observe-fixture.mjs
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
