- id: llm-deepseek
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: shared-voice-fixture
      name: ./shared-voice-fixture.mjs
    - id: tool-jubian
      name: '../../../packages/jubian/tool-jubian/tests/snapshot-plugin.mjs'
      config:
        baseUrl: https://shared-voice.invalid/prod-api
        workspaceSecrets: false
        ledgerRoot: !!js "process.cwd() + '/.dsh/jubian-pending-ledger'"
