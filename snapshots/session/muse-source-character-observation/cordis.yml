- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: llm-deepseek
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: subprocess
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
                inputModalities: [text, image]
    - id: snapshot-video-media
      name: '../../../packages/perception/tool-video-inspect/tests/snapshot-media.ts'
    - id: character-report-proof
      name: './report-proof.mjs'
    - id: tool-video-inspect
      name: './video-plugin.mjs'
      config:
        sourceReviewCompanion: true
        reviewBatchFrames: 2
        reviewObserveNextBatch: false
