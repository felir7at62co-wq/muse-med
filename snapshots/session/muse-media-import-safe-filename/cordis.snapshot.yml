- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: llm-deepseek
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- insert:
    - id: snapshot-media-present
      name: '@deepseek-ai/dsh-tool-present'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: snapshot-muse-media-import-safe-filename
      name: './media-fixture.mjs'
    - id: snapshot-media-discovery
      name: '@deepseek-ai/dsh-tool-discovery'
      config:
        alwaysLoad: [present]
        capabilities:
          - id: company-media
            title: Company media
            description: Public media data, company downloads, owned tasks and verified local imports.
            tools: [muse_media_data, muse_media_download, muse_media_task, muse_media_import]
