# Bash executes the packaged offline scope CLI; this case does not use PowerShell.
- id: tool-bash
  disabled: false

- id: tool-pwsh
  disabled: true

# This scenario loads only its workspace skills and no checkout instructions.
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.cwd() + '/.dsh/skills']"
    watch: false
