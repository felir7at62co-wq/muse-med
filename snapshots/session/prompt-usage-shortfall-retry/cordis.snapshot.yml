# Replay two synthetic, already rejected model responses through the shipped retry executor.
- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            retryPolicy:
              mode: normal
              maxRetries: 8
              retryableCodes: [EMPTY_RESPONSE, INVALID_TOOL_ARGUMENTS, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, PROMPT_USAGE_SHORTFALL]
              consecutiveRetryLimits: { PROMPT_USAGE_SHORTFALL: 1 }
              backoff: { initialDelayMs: 1, maxDelayMs: 1, jitterRatio: 0 }
            models:
              - id: deepseek-v4-flash
