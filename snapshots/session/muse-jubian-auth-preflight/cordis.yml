- id: llm-deepseek
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill
  disabled: true
- id: tool-skill
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: tool-web
  disabled: true
- insert:
    - id: auth-transport-fixture
      name: './auth-transport-fixture.mjs'
    - id: tool-jubian
      name: '../../../packages/jubian/tool-jubian/tests/snapshot-plugin.mjs'
      config:
        baseUrl: https://jubian-auth-preflight.invalid/prod-api
        workspaceSecrets: false
    - id: auth-preflight-fixture
      name: './auth-preflight-fixture.mjs'
- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
