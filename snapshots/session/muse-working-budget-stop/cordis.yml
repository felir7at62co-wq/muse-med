# Only this fixture reserves a deliberately infeasible safe input budget.
- id: llm-deepseek
  disabled: true
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.9
    workingTokenLimit: 256
    headroomTokens: 606528
    retainTokens: 20
    maxTokens: 32
    maxOverflowRetries: 1
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
- insert:
    - id: working-budget-fixture
      name: ./budget-fixture.mjs
