- id: llm-deepseek
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: []
    watch: false
- id: subprocess
  disabled: true
- insert:
    - id: snapshot-ocr-utf8
      name: './ocr-utf8-fixture.mjs'
    - id: tool-video-inspect
      name: '@deepseek-ai/dsh-tool-video-inspect'
      config:
        ocrEngine: rapidocr
        ocrPythonPath: ocr-fixture-python
