# Mount the selected account route and the actual short-drama compaction policy.
- id: llm-deepseek
  disabled: true
- id: compaction-basic
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
- insert:
    - id: snapshot-small-window-compaction
      name: './account-fixture.mjs'
