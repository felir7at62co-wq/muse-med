- id: permission
  config:
    defaultPreset: danger-full-access
    registerCommand: false
    presets:
      read-only: { sandbox: read-only, approval: ask }
      workspace-write: { sandbox: workspace-write, approval: ask }
      danger-full-access: { sandbox: danger-full-access, approval: never }

# Desktop's Web bundle keeps these Host-level tools disabled.
- id: plan-mode
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-ptc
  disabled: true

- id: tool-workflow
  disabled: true

# Mount the current short-drama preset; keep shell availability platform independent.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- insert:
    - id: subagent-model-selection-settings
      name: '@deepseek-ai/dsh-tool-subagent/model-selection-settings'
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: short-drama
    - id: snapshot-short-drama-draft-ending
      name: './short-drama-preset-fixture.mjs'
