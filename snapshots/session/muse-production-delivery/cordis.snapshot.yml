- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]

# The real producer publishes its source manifest; strict rendering still requires source reviews.
- id: llm-deepseek
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: tool-shot-script
      name: '../../../packages/drama/tool-shot-script/tests/production-delivery-snapshot-plugin.mjs'
      config:
        reviewMode: advisory
    - id: tool-episode-render
      name: '../../../packages/drama/tool-episode-render/src/index.ts'
      config:
        requireSourceReview: true
        preferNvenc: false
- id: agent-instructions
  disabled: true
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    museHome: !!js process.env.DSH_HOME
    includeDefaultRoots: false
    customSkillDirs: !!js "[process.cwd() + '/.dsh/skills']"
    watch: false
