# Pin an unused runner so this shell-free fixture has the same skill catalog on every platform.
- id: sandbox
  config:
    runnerCommand: [snapshot-unused-runner]
    runnerFailureSignatures: [snapshot-unused-runner-failure]
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- insert:
    - id: video-delivery
      name: './runtime.mjs'
