- id: llm-deepseek
  disabled: true
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 1000000
                defaultMaxTokens: 256000
                reasoningEfforts: [off, low, high, max]
                defaultReasoningEffort: max
    - id: muse-hongguo-download
      name: '../../../third_party/plugins/muse-hongguo-download/src/index.js'
    - id: muse-douyin-download
      name: '../../../third_party/plugins/muse-douyin-download/src/index.js'
      config:
        pythonExecutable: !!js process.execPath
        ffprobeExecutable: !!js process.execPath
        ffmpegExecutable: !!js process.execPath
        settingsHome: !!js process.env.DSH_HOME
        nativeTimeoutMs: 1800000
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'
- id: subprocess
  disabled: true
- insert:
    - id: snapshot-douyin-share-data-fallback-transport
      name: './transport-fixture.mjs'

# Durable task IDs include the real owning Session; the normal runner resumes this fixture-owned header.
- id: headless-runner
  inject: [headlessStartup, douyinReplayOwnerReady]
  config:
    task: !!js ctx.headlessStartup.task
    sessionId: snapshot-douyin-share-data-fallback
    json: !!js ctx.headlessStartup.json
