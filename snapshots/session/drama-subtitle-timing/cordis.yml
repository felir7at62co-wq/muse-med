# This replay never invokes a shell; use the same tool catalog on every platform.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

# This subtitle-only replay never invokes skills; keep OS-specific catalogs out of its composition.
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: true

- insert:
    - id: tool-episode-render
      name: '../../../packages/drama/tool-episode-render/src/index.ts'
      config:
        ffprobePath: subtitle-timing-fixture-ffprobe
    - id: subtitle-probe-fixture
      name: './probe-fixture.mjs'
