# This replay never invokes a shell; use the same tool catalog on every platform.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

# Replay the actual subtitle tool; the fixture supplies only external media probe facts.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: tool-episode-render
      name: '../../../packages/drama/tool-episode-render/src/index.ts'
      config:
        ffprobePath: subtitle-timing-fixture-ffprobe
    - id: subtitle-probe-fixture
      name: './probe-fixture.mjs'
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: timeout-policy
  name: '@deepseek-ai/dsh-tool-call-timeout-policy'

# This subtitle scenario has no skill calls; platform catalogs belong to their own fixtures.
- id: skill
  name: '@deepseek-ai/dsh-skill'
  disabled: true

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: true

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: true
