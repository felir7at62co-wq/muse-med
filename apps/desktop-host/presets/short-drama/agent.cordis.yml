# Product-owned agent contributions; runtime services remain on the Desktop Host.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是 muse-med 短剧编导 Agent。

      直接面向用户时，先简短说明结论，再按事项分组，区分已完成、进行中和待决定。突出实际产物与下一步，避免重复堆砌。比较方案、多项交付、收集选择或表单时，主动用可用的 show_view 展示，不等用户点名要卡片；复杂交互图表按需用 visualize，首次先加载对应技能。简单问题用文字，卡片只展示有依据的数据，不为展示额外生成、收费或改写完整来源。接收主会话派发的任务时，在本会话执行，用 coordinator_report 将结果或待补信息交回主会话；卡片不代替回报，不直接另向用户征求确认。

      用户要求生成或修改内容时，在授权范围内实际操作并按范围继续；不要把计划或“开始做”当作完成，也不要承诺轮次结束后会自行继续。汇报已保存或已修改的内容应以实际工具结果或回读为依据；确有阻塞时列明已完成项和未完成项。用户要整部或多集剧本的转写、改编或洗稿时，在收到请求的这一轮调用 create_goal，写明范围、每轮集数和交付方式，按默认做法连续推进；格式、用词等待定问题写进批次汇报，不停下等回复。

      用户提供具体抖音作品链接并要求作品数据或剧名线索时，先用 tool_search 查找 muse_media_data 读取公开作品数据，并按可用工具的实际结果处理；需要下载抖音视频时查找 douyin_download，经数据站下载并取得视频地址。工具缺失、登录验证或访问失败时说明实际状态，不据此断言所有抖音链接都无法访问。作品文案和作者不是已确认剧名，剧名需要来源证据。

      抖音上有的完整短剧都可以用常驻的 hongguo_download 下载。用户要下载整部短剧（给出剧名、红果链接或抖音上看到的短剧）时，先按剧名取得红果 seriesId：用 tool_search 查找 hongguo_search 后检索，或采用用户给出的红果编号；再用 hongguo_download 下载全集或指定集。douyin_download 只下载用户给出的具体抖音作品或抖音合集，不用它逐条拼凑整部短剧。检索或下载失败时说明实际状态，不据此断言该剧无法下载。

      只给已有成稿绑定素材时加载 muse-bind-existing-assets。当前任务结束或取消时用 end_task_skill 结束该阶段；同一任务继续时沿用已选技能。

      镜流是本机 Muse 的云制片台。用 jingliu_projects 搜索项目，按用户确认的项目 ID 工作。分集后用 jingliu_studio 逐集对照原稿，检查对白遗漏、重复和断点。使用镜流的要素提取和资产匹配，审校角色、场景和道具的提示词与引用。按本预设的分镜写法编写视频提示词，读回绑定素材，用 set_shot_prompt 的 lock=true 写入定稿。需要生图时用 jingliu_image，默认 GPT Image 2。后期用镜流排字幕和高清，回读字幕文字、人物名和时间。导出剪映后把实际本机草稿路径和交付集数发回聊天。

      在镜流制作短剧时，先用 jingliu_workflows 查找当前服务提供的工作流和参数，用 jingliu_run 操作明确选定的项目；解说剧·角色开口用 jingliu_narration。项目、分集、镜头与素材编号以该站点实际返回为准。无法连接或未登录时，说明如何配置或登录镜流。用户只要预览时展示内容后停止。提交前核对项目与范围，按工具返回的报价确认，提交结果未知时先查原任务。

      以完整、连贯、高质量的视频段落为目标，先通读本集，按剧情、对白、表演、动作衔接和剪辑节奏分包，充分使用所选模型的语义理解、连续动作和多镜头编排能力。同一时空内衔接清楚的连续段落在模型支持范围内能够完整表达时，优先按完整段落设计；一个视频包可以包含多个镜头，不因提示词长、镜头多、固定秒数机械拆包。确需拆分时，说明具体剧情、节奏、素材状态冲突、已核实的模型限制或实际生成问题。

      根据原稿与用户选定的制作范围区分提案、保存和生成。保存用户确认的修改后回读项目、集号、镜头、时长、素材和提示词。只做镜头脚本或检查成片时，在对应交付物处结束。用户要求原台词不动时，连同说话人、语气和顺序逐字保留。服务拒绝或生成失败时说明原因及可选改法，改动原稿须取得用户同意。

      每镜按实际出镜的人物、场景、道具和声音核对参考；缺少关键素材时说明缺什么，用已有图或文字给出空间关系。核对同一时空各镜的站位、手持物、动作方向和声音连续性，按项目既定画幅与画风设计镜头。

      复杂任务可按需使用官方 Agent Team 的共享任务板和子代理分工，不为简单任务机械创建团队。委派时完整传递用户原文、来源版本、明确不动的范围、附件与验收条件；不得因拆分任务扩大生成费用或操作授权。子代理不能创建独立日程，结果由本执行会话核对后统一交付；团队任务完成不等于用户验收。

      多集剧本的转写、改编或洗稿分给多个子代理前，先在项目里保存人物表；每份简报写明人物表路径、本区间来源文件路径、上一区间实际结尾和须留给后文的线索，新人物与改名交回主会话登记。补派缺集前先读已落盘的相邻集，不把仍在写的集号交给另一个子代理。方法见 screenplay-format 写作品质的“人物表与分段协作”。

      精修对白先加载 muse-dialogue-polish，检查剧情漏洞、衔接或重复先加载 muse-script-doctor，重新分集先加载 muse-episode-design，换梗或洗稿先读 screenplay-format 写作品质，再动稿。在当前保存的正文上逐处修改并回读，不凭记忆整集重写，也不用脚本对全部分集做不看上下文的批量替换。
    suffix: 短剧工作间是当前工作目录中的 short-drama/。
    complete: false
- id: short-drama-guidance
  name: '@deepseek-ai/dsh-desktop-host/short-drama-guidance'
- id: editing-policy
  name: '@deepseek-ai/dsh-desktop-host/editing-policy'
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: time-context
  name: '@deepseek-ai/dsh-time-context'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-schedule
  name: '@deepseek-ai/dsh-tool-schedule'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  config:
    scopedCatalogOwner: true
    taskSkills: [muse-bind-existing-assets, muse-dialogue-polish, office-docx]
    taskSkillMaxChars: 8192
- id: character-reference
  name: cordis:group
  group: true
  isolate:
    characterReferenceAuthority: true
  config:
    - id: tool-character-reference
      name: '@deepseek-ai/dsh-tool-character-reference'

# Script Workshop jobs register only while the Host provides workshopConnection.
- id: tool-workshop
  name: '@deepseek-ai/dsh-tool-workshop'

- id: tool-shot-script
  name: '@deepseek-ai/dsh-tool-shot-script'
  config:
    reviewMode: advisory
    speechCharsPerSecond: 5

- id: tool-bgm-compose
  name: '@deepseek-ai/dsh-tool-bgm-compose'
  config:
    maxSourceGainDb: -10
    ffmpegPath: !!js process.env.DSH_FFMPEG_PATH || 'ffmpeg'
    ffprobePath: !!js process.env.DSH_FFPROBE_PATH || 'ffprobe'
- id: tool-episode-render
  name: '@deepseek-ai/dsh-tool-episode-render'
  config:
    defaultEndingEffectFit: !!js process.env.MUSE_DEFAULT_ENDING_EFFECT_FIT || 'stretch_to_window'
    normalizeSubtitleText: true
    enforceSubtitleVisual: true
    defaultSubtitleVisual:
      schema_version: 1
      reference_width: 480
      reference_height: 854
      font_size_px: 46
      outline_px: 1.25
      center_y_ratio: 0.736747073
      max_width_ratio: 0.9
    maxBgmVolume: 1
    ffmpegPath: !!js process.env.DSH_FFMPEG_PATH || 'ffmpeg'
    ffprobePath: !!js process.env.DSH_FFPROBE_PATH || 'ffprobe'
    fontsDir: !!js process.env.MUSE_FONTS_DIR || 'C:/Windows/Fonts'
    subtitleFontFamily: !!js process.env.MUSE_SUBTITLE_FONT_FAMILY || process.env.MUSE_FONT_FAMILY || 'SimHei'
    watermarkFontFamily: !!js process.env.MUSE_WATERMARK_FONT_FAMILY || process.env.MUSE_FONT_FAMILY || 'Microsoft YaHei'
- id: perception-bgm
  name: '@deepseek-ai/dsh-perception-bgm'
  config:
    catalogUrl: https://muse.tos-cn-beijing.volces.com/bgm/catalog.json
    requireStoryEvidence: true
    # The packaged product binds its own offline interpreter, model and caches;
    # a deployment without that payload keeps catalogue matching only.
    pythonExecutable: !!js >-
      process.env.MUSE_BGM_RUNTIME_DIR ? `${process.env.MUSE_BGM_RUNTIME_DIR}/python/python.exe` : undefined
    dataDir: !!js >-
      process.env.MUSE_BGM_RUNTIME_DIR ? `${process.env.MUSE_BGM_RUNTIME_DIR}/models/data` : undefined
    weightsPath: !!js >-
      process.env.MUSE_BGM_RUNTIME_DIR ? `${process.env.MUSE_BGM_RUNTIME_DIR}/models/J_all.ckpt` : undefined
    env: !!js >-
      (() => {
        const root = process.env.MUSE_BGM_RUNTIME_DIR;
        if (!root) return undefined;
        const home = process.env.DSH_HOME;
        if (!home) throw new Error('Bundled BGM requires an explicit product home');
        const cache = `${home}/perception/bgm/runtime-cache`;
        const interpreter = `${root}/python`;
        const separated = [interpreter, `${interpreter}/DLLs`, `${interpreter}/Library/bin`, process.env.PATH ?? ''].filter(Boolean);
        return {
          PATH: separated.join(process.platform === 'win32' ? ';' : ':'),
          HF_HOME: `${root}/models/hf-cache`,
          HF_MODULES_CACHE: `${cache}/hf-modules`,
          NUMBA_CACHE_DIR: `${cache}/numba`,
          MPLCONFIGDIR: `${cache}/matplotlib`,
          HOME: cache, USERPROFILE: cache, APPDATA: cache, LOCALAPPDATA: cache,
          HF_HUB_OFFLINE: '1', TRANSFORMERS_OFFLINE: '1', HF_HUB_DISABLE_TELEMETRY: '1',
          PYTHONNOUSERSITE: '1', PYTHONDONTWRITEBYTECODE: '1',
          OMP_NUM_THREADS: '1', MKL_NUM_THREADS: '1', OPENBLAS_NUM_THREADS: '1'
        };
      })()
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        adaptiveBudget: true
        workingTokenLimit: 475000
        thresholdRatio: 0.45
        headroomTokens: 16384
        retainTokens: 65536
        maxTokens: 16384

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
        preserveToolNames: []
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: delegation
  name: cordis:group
  group: true
  config:
    - id: delegation-policy
      name: '@deepseek-ai/dsh-desktop-host/delegation-policy'
      config:
        teamByDefault: true
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
- id: present
  name: '@deepseek-ai/dsh-tool-present'

- id: tool-office
  name: '@deepseek-ai/dsh-tool-office'

- id: tool-audio-transcribe
  name: '@deepseek-ai/dsh-tool-audio-transcribe'
  config:
    ffmpegPath: !!js process.env.DSH_FFMPEG_PATH || 'ffmpeg'
    ffprobePath: !!js process.env.DSH_FFPROBE_PATH || 'ffprobe'

- id: tool-video-inspect
  name: '@deepseek-ai/dsh-tool-video-inspect'
  config:
    requireCompleteReview: true
    # Parallel transcription workers share the default two FFmpeg slots; a caller waits for a free slot instead of failing.
    slotWaitMs: 300000
    offloadObservedFrames: true
    reviewObserveNextBatch: true
    frameFormat: jpeg
    frameJpegQuality: 3
    ocrEngine: rapidocr
    ocrPythonPath: !!js process.env.MUSE_OCR_PYTHON_PATH || 'python3'
    ffmpegPath: !!js process.env.DSH_FFMPEG_PATH || 'ffmpeg'
    ffprobePath: !!js process.env.DSH_FFPROBE_PATH || 'ffprobe'

# Public Hongguo metadata tools register only inside this creative preset.
