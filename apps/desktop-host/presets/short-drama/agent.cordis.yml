    bytevc2Executable: !!js process.env.MUSE_HONGGUO_BYTEVC2_PATH || ''

- id: muse-reverse-tools
  name: muse-reverse-tools

- id: muse-fanqie-download
  name: muse-fanqie-download
  config:
    pythonExecutable: !!js process.env.MUSE_FANQIE_PYTHON_PATH || process.env.MUSE_HONGGUO_PYTHON_PATH || ''

- id: muse-lvpaopao
  name: muse-lvpaopao
