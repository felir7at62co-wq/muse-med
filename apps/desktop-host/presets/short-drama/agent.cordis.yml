            headroomTokens: 16384
            maxTokens: 8192
          - provider: muse-cloud-yunying
            model: gpt-6-astra
            headroomTokens: 16384
            maxTokens: 8192
          - provider: muse-cloud-yunying
            model: claude-opus-5-5
            headroomTokens: 16384
            maxTokens: 8192
          - provider: muse-cloud-yunying
            model: claude-fable-5-1
            headroomTokens: 16384
            maxTokens: 8192
          - provider: muse-cloud-yunying
            model: claude-sonnet-5-5
            headroomTokens: 16384
            maxTokens: 8192
          - provider: muse-cloud-yunying
            model: gemini-3.1-pro
            headroomTokens: 16384
            maxTokens: 8192
          - provider: muse-cloud-yunying
