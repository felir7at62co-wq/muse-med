# Product defaults remain below user profile settings.
# Shared drama settings must be declared before the user profile layer.
- insert:
    - id: drama-settings
      name: '@deepseek-ai/dsh-drama-settings'

- id: agent-preset-registry
  config:
    default: short-drama
    selectablePresets: [short-drama, main-session]
    allowUserDefault: false

- id: ui-conversation
  config:
    busyEnter: steer

- id: permission
  config:
    defaultPreset: danger-full-access
    registerCommand: true
    presets:
      read-only: { sandbox: read-only, approval: ask }
      workspace-write: { sandbox: workspace-write, approval: ask }
      danger-full-access: { sandbox: danger-full-access, approval: never }

# Muse supplies its signed-in cloud catalog; users may configure their own native models.
- id: llm-deepseek
  config:
    models: []

# Continue output-limited responses through normal requests and compaction, and ask again
# when a response stops with hidden reasoning only: the user would otherwise receive nothing.
- insert:
    - id: agent-output-continuation
      name: '@deepseek-ai/dsh-agent-output-continuation'
      config:
        maxContinuations: null
        maxNoProgressResponses: 2
        repeatWindowChars: 16384
        maxSilentStopRecoveries: 2

# A single object repeating one member 64 times cannot advance a tool call.
# Discard malformed tool calls and allow one bounded response recovery per turn.
- insert:
    - id: tool-argument-loop
      name: '@deepseek-ai/dsh-argument-loop'
      config:
        repeatedPropertyLimit: 64
        recoveryAttempts: 1

# Muse account models reserve a bounded budget for summaries.
- id: compaction-basic
  config:
    adaptiveBudget: true
    workingTokenLimit: 475000
    thresholdRatio: 0.45
    headroomTokens: 16384
    retainTokens: 65536
    maxTokens: 16384

# Feishu credentials and policy remain editable in the user profile.
- id: feishu-channel
  config:
    enabled: false
    requireMention: true
    denyTools: [exit_plan_mode]

# Optional conversation presentation remains below the editable profile layer.
- insert:
    - id: ui-session-video
      name: '@deepseek-ai/dsh-client-ui-session-video'
      config:
        pixelsPerSecond: 48

# Routing role and task directory are independently removable plugin contributions.
- insert:
    - id: muse-session-activity
      name: '@deepseek-ai/dsh-session-activity'
    - id: muse-session-coordinator
      name: '@deepseek-ai/dsh-session-coordinator'
      config:
        mainPreset: main-session
        workerPreset: short-drama
        searchLimit: 30
        readChars: 24000
        # Only used when unattended: one more fresh worker before a task is marked for a person.
        redispatchLimit: 2
    - id: muse-coordination-worker
      name: '@deepseek-ai/dsh-session-coordinator/worker'
    # Inactive until botId and targetId of a saved DSH-IM delivery target are set in the configuration file.
    - id: muse-unattended-notify
      name: '@deepseek-ai/dsh-desktop-host/unattended-notify'
    - id: ui-muse-session-coordinator
      name: '@deepseek-ai/dsh-client-ui-session-coordinator'
