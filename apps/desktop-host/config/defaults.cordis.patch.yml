# Product defaults remain below user profile settings.
# Shared drama settings must be declared before the user profile layer.
- insert:
    - id: drama-settings
      name: '@deepseek-ai/dsh-drama-settings'

- id: agent-preset-registry
  config:
    default: short-drama
    selectablePresets: [short-drama, bot-coordinator]

- id: ui-conversation
  config:
    busyEnter: steer

- id: permission
  config:
    defaultPreset: danger-full-access
    registerCommand: true
    presets:
      read-only: { sandbox: read-only, approval: ask }
      workspace-write: { sandbox: workspace-write, approval: ask }
      danger-full-access: { sandbox: danger-full-access, approval: never }

# Muse supplies its signed-in cloud catalog; users may configure their own native models.
- id: llm-deepseek
  config:
    models: []

# Continue output-limited responses through normal requests and compaction.
- insert:
    - id: agent-output-continuation
      name: '@deepseek-ai/dsh-agent-output-continuation'
      config:
        maxContinuations: null
        maxNoProgressResponses: 2
        repeatWindowChars: 16384

# A single object repeating one member 64 times cannot advance a tool call.
# Discard malformed tool calls and allow one bounded response recovery per turn.
- insert:
    - id: tool-argument-loop
      name: '@deepseek-ai/dsh-argument-loop'
      config:
        repeatedPropertyLimit: 64
        recoveryAttempts: 1

# Muse account models reserve a bounded budget for summaries.
- id: compaction-basic
  config:
    modelPolicies:
      - provider: muse-cloud-deepseek-official
        model: deepseek-flash
        headroomTokens: 16384
        maxTokens: 16384
        workingTokenLimit: 475000
        thresholdRatio: 0.45
        retainTokens: 65536
      - provider: muse-cloud-deepseek-official
        model: deepseek-v4-pro
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: gpt-6-sol
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: gpt-6-astra
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: claude-opus-5-5
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: claude-fable-5-1
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: claude-sonnet-5-5
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: gemini-3.1-pro
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: glm-5.3-flash
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-zhipu-official
        model: glm-5.3-flashx
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-zhipu-official
        model: glm-5.3-flash
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-deepseek-official
        model: deepseek-v4.1-flash-261017
        workingTokenLimit: 475000
        thresholdRatio: 0.45
        headroomTokens: 16384
        retainTokens: 65536
        maxTokens: 16384

# Feishu credentials and policy remain editable in the user profile.
- id: feishu-channel
  config:
    enabled: false
    requireMention: true
    denyTools: [exit_plan_mode]
