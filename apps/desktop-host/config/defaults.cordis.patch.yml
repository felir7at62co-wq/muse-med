# Product defaults remain below user profile settings.
- id: agent-preset-registry
  config:
    default: short-drama

# Muse supplies its signed-in cloud catalog; users may configure their own native models.
- id: llm-deepseek
  config:
    models: []

# Continue output-limited responses through normal requests and compaction.
- insert:
    - id: agent-output-continuation
      name: '@deepseek-ai/dsh-agent-output-continuation'
      config:
        maxContinuations: null
        maxNoProgressResponses: 2
        repeatWindowChars: 16384

# Muse account models reserve a bounded budget for summaries.
- id: compaction-basic
  config:
    modelPolicies:
      - provider: muse-cloud-deepseek-official
        model: deepseek-flash
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-deepseek-official
        model: deepseek-v4-pro
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: gpt-6-sol
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: gpt-6-astra
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: claude-opus-5-5
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: claude-fable-5-1
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: claude-sonnet-5
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: gemini-3.1-pro
        headroomTokens: 16384
        maxTokens: 8192

# Feishu credentials and policy remain editable in the user profile.
- id: feishu-channel
  config:
    enabled: false
    requireMention: true
    denyTools: [ask_user_question, exit_plan_mode]
