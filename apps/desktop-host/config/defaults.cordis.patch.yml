# Product defaults remain below user profile settings.
- id: agent-preset-registry
  config:
    default: short-drama

# Muse supplies its signed-in cloud catalog; users may configure their own native models.
- id: llm-deepseek
  config:
    models: []

# Cloud models with a 128k window use a smaller summary reserve.
- id: compaction-basic
  config:
    modelPolicies:
      - provider: muse-cloud-yunying
        model: gpt-6-sol
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: gpt-6-astra
        headroomTokens: 16384
        maxTokens: 8192
      - provider: muse-cloud-yunying
        model: gemini-3.1-pro
        headroomTokens: 16384
        maxTokens: 8192

# Feishu credentials and policy remain editable in the user profile.
- id: feishu-channel
  config:
    enabled: false
    requireMention: true
    denyTools: [ask_user_question, exit_plan_mode]
