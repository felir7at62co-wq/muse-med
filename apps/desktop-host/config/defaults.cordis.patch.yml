# Product defaults remain below user profile settings.
- id: agent-preset-registry
  config:
    default: short-drama

# Shipped API-key routes contain only public model and endpoint metadata. Each
# installation stores YUNYING_GPT_API_KEY and DEEPSEEK_API_KEY privately.
- id: llm-pi-ai
  config:
    providers:
      yunying-gpt:
        displayName: 云映 GPT
        apiKeyEnv: YUNYING_GPT_API_KEY
        api: openai-completions
        baseURL: https://wy6688.token6688.com/v1
        models:
          - id: gpt-5.6-sol
            name: gpt-5.6-sol

# The native deepseek-official route uses its built-in model catalog and
# DEEPSEEK_API_KEY reference; do not shadow it with an empty model list.

# Feishu credentials and policy remain editable in the user profile.
- id: feishu-channel
  config:
    enabled: false
    requireMention: true
    denyTools: [ask_user_question, exit_plan_mode]
