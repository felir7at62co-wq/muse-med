# Electron reuses the browser composition without its network and browser-launch rows.

# The product speaks for itself: the harness identity line would tell every agent it
# is powered by the upstream harness, and a model repeats that to the team. The base
# bundle's own persona prefix is restated because a patch replaces the whole config.
- id: system-prompt
  config:
    personaPrefix: ''
    includeHarnessIdentity: false

# The independent product owns its roster; it does not import DSH user modes.
# The short-drama preset is the product's own composition, not the shipped preset
# of the same id: `includeShippedRoot` stays false so a deployment upgrade cannot
# shadow it, and the roster reads exactly the five directories under `presets/`.
- id: agent-presets
  config:
    default: short-drama
    includeShippedRoot: false
    includeUserRoot: false

# All product agents inherit this Host provider. The runtime supplies its real bundled path.
- id: skill-filesystem
  disabled: false
  config:
    includeDefaultRoots: false

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # One host settings namespace, shared by desktop sessions. The per-script
    # budget defaults to ¥4000 and authorizes priced Jubian calls automatically.
    - id: drama-settings
      name: '@deepseek-ai/dsh-drama-settings'

    # Jubian also publishes Remote services consumed by Desktop Settings, so
    # it belongs on the Host rather than inside one agent preset.
    - id: tool-jubian
      name: '@deepseek-ai/dsh-tool-jubian'

# The bundled Feishu bridge ships off. `disabled` is the entry-level switch the
# Loader honors and the only one that keeps this row's plugin code from running
# at all; `desktopComposition` appends the effective value from this product's
# settings document (`feishu.enabled`, an absent document or section meaning
# off), so an untouched Desktop runs none of the bridge: no sync layer, no
# control server, no peer heartbeat, no QR app registration, and no read of
# another deployment's sync directory. The switch takes effect at the next
# backend start.
#
# The three activation controls below are real keys of the staged package,
# because the community build applies the compatibility overlay at
# third_party/plugins/compatibility/lark-desktop.mjs, which adds them to the
# bridge's Config with `true` defaults. This patch alone is what they are for: a
# composition that skips the gate layer mounts the bridge and returns before
# those paths, `enabled: false` keeping it inert there, and the other two keeping
# closed the paths this product never opted into. The gate layer replaces this
# config wholesale with these controls and the product's switch, so activation is
# the switch alone. The bridge registers that config as the base of its own
# `dsh-lark-bridge` settings namespace, so an override stored under that section
# still wins: a stored `enabled: false` keeps the bridge inert with the row
# activated, and a stored `enabled: true` cannot activate a disabled row. A patch
# replaces the whole config, so credentials are deliberately absent here and come
# from this product's settings namespace alone.
- id: feishu-channel
  disabled: true
  config:
    enabled: false
    autoRegistration: false
    crossInstanceSync: false
    requireMention: true
    denyTools: [ask_user_question, exit_plan_mode]
