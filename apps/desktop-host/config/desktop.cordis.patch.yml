# Electron reuses the authenticated Web composition on an OS-assigned loopback port.

# The product speaks for itself: the harness identity line would tell every agent it
# is powered by the upstream harness, and a model repeats that to the team. The base
# bundle's own persona prefix is restated because a patch replaces the whole config.
- id: system-prompt
  config:
    personaPrefix: ''
    includeHarnessIdentity: false

# The upstream preset registry is the engine, and the product declares every preset itself: the
# six directories under `presets/` become six rows through the adapter in src/index.ts, which
# knows the runtime directory holding them. The product therefore imports none of the base bundle's
# DSH user modes, and those shipped rows are disabled below because a deployment upgrade must not
# shadow a product preset of the same id.
# The base bundle ships one row per native coding mode. The product replaces all four ids with its
# own adapted compositions under `presets/`, so leaving these active would both shadow those rows
# and mount a second filesystem skill provider — the shipped `cordis`, `standard`, and `ptc`
# definitions carry their own row, and the last two select default roots, which only the Host
# provider may do.
- id: preset-cordis
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-ptc
  disabled: true

- id: preset-standard
  disabled: true

# All product agents inherit this Host provider. The runtime supplies its real bundled path.
- id: skill-filesystem
  disabled: false
  config:
    includeDefaultRoots: false

- id: web-startup
  disabled: false

- id: webserver
  disabled: false
  config:
    host: 127.0.0.1
    port: 0
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: web-runtime
  disabled: false
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: false
    trustedHosts: []

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # One host settings namespace, shared by desktop sessions. The per-script
    # budget defaults to ¥4000 and authorizes priced Jubian calls automatically.
    - id: drama-settings
      name: '@deepseek-ai/dsh-drama-settings'

    # Jubian also publishes Remote services consumed by Desktop Settings, so
    # it belongs on the Host rather than inside one agent preset.
    - id: tool-jubian
      name: '@deepseek-ai/dsh-tool-jubian'
      config:
        imagePlatformId: KU_AI

    # Account credentials travel through the authenticated Settings Remote call;
    # the bundled MCP child exposes account-scoped Wiki writes and authorized reads.
    - id: muse-account
      name: '@deepseek-ai/dsh-muse-account'
      config:
        baseUrl: !!js process.env.MUSE_BASE_URL || 'https://muse.aigc-pipeline.cn'
        excludedModelPrefixes: [gpt-, chatgpt-, o1, o3, o4]

    - id: ui-muse-account
      name: '@deepseek-ai/dsh-client-ui-muse-account'
      config:
        feedbackUrl: !!js new URL('/feedback', process.env.MUSE_BASE_URL || 'https://muse.aigc-pipeline.cn').href


# The bundled Feishu bridge is composed inert: the activation controls below are
# real keys of the staged package, because the community build applies the
# compatibility overlay at third_party/plugins/compatibility/lark-desktop.mjs,
# which adds them to the bridge's Config with `true` defaults. `enabled: false`
# is the fail-safe — a composition that skips the gate layer mounts the bridge
# and returns before its sync layer, control server, peer heartbeat, or QR app
# registration — and the other two keep closed the paths this product never
# opted into. `desktopComposition` appends the effective value from the product
# switch (`feishu.enabled`, an absent row or section meaning off), so an
# untouched Desktop runs none of the bridge. The switch takes effect at the next
# backend start.
#
# The row stays mounted rather than entry-disabled: in this harness a plugin's
# settings section IS its own Config, so a disabled row has no section to write,
# and the Settings page must be able to store the credential pair a scan
# produces before the bridge is ever asked to run. The gate layer replaces this
# config wholesale with these controls and the product's switch, so activation
# is the switch alone: a value stored under the bridge's own section cannot
# activate a row the switch left off. A patch replaces the whole config, so
# credentials are deliberately absent here and come from the bridge row's own
# stored section alone.
- id: feishu-channel
  config:
    enabled: false
    autoRegistration: false
    crossInstanceSync: false
    requireMention: true
    denyTools: [ask_user_question, exit_plan_mode]
