          hongguo_search: [红果搜索, 搜红果短剧, 按剧名找短剧, 红果剧集编号, 抖音短剧剧名]
          hongguo_download: [红果下载, 下载红果短剧, 下载短剧全集, 抖音短剧下载, 抖音完整短剧]
          hongguo_download_info: [红果分集目录, 红果集数, 核对红果剧集]
          hongguo_download_task: [红果下载任务, 红果下载进度, 红果后台下载, 恢复红果下载, 取消红果下载]
          screenplay_export_docx: [Word, docx, 导出剧本, 剧本文档]
          load_workspace_dependencies: [Word, docx, Office, 文档处理, 工作间依赖]
          muse_skill_evolution: [技能进化, 技能学习, 经验复盘, 技能提案, 技能版本, 撤回技能]

        capabilities:
          - id: jingliu
            title: 镜流
            description: 查找镜流工作流，按项目查看分集、分镜、素材、任务和交付。
            tools: [jingliu_projects, jingliu_workflows, jingliu_run, jingliu_narration, jingliu_image, jingliu_studio]
          - id: interaction
            title: 对话交互与反馈
            description: 展示交互卡片、收集选择与表单，提交和查询本人的产品反馈。
            tools: [ask_user_question, show_view, visualize, muse_feedback_submit, muse_feedback_status]
          - id: workspace
            title: 文件与工作间
            description: 查找、读取、编辑项目文件并交付文档。
            tools: [read, read_image, write, edit, apply_patch, glob, grep, bash, pwsh, skill, present, working_directory]
          - id: video-understanding
            title: 视频理解与转写
            description: 查看视频画面、抽帧、识别对白和字幕。
            tools: [video_inspect, video_contact_sheet, audio_transcribe, video_ocr]
          - id: screenplay
            title: 剧本与分镜
            description: 整理剧本、编写镜头脚本并对照来源证据。
            tools: [drama_project, drama_shot, 'manuscript_*', video_inspect]
          - id: assets
            title: 本地项目角色参考
            description: 按既有项目读取角色目录、检索候选并查看参考图。
            tools: ['drama_character_*']
          - id: editing-delivery
            title: 剪辑配乐与交付
            description: 导出 Word 剧本、处理 Office 文档、创建剪映草稿、查找草稿目录、匹配配乐与整理成片。
            tools: [screenplay_export_docx, load_workspace_dependencies, office_convert, office_recalculate, office_render, jianying_draft, drama_draft_dir, drama_render, drama_video, drama_bgm, bgm_match]
          - id: data-sourcing
            title: 数据选材与下载
            description: 采集红果、七猫与抖音公开数据，保存观测快照、比较指标、人工核验作品关系并生成选材报告，搜索和下载小说、剧目及视频素材。
            tools: ['hongguo_*', 'douyin_*', muse_media_data, 'fanqie_*', 'qimao_*', source_snapshot, source_report, work_mapping, lvpaopao]
          - id: knowledge
            title: 技能、MCP 与项目资料
            description: 管理学习技能与版本，读取已连接的 MCP 资源与项目资料。
            tools: [source_recover, skill_catalog, read_mcp_resource, list_mcp_resources, list_mcp_resource_templates, muse_skill_evolution]
          - id: coordination
            title: 子任务与跟进
            description: 委派子任务、查看执行状态、管理后台工作并安排定时跟进。
            tools: ['subagent*', send_message, interrupt_agent, wait_agent, list_agents, 'job_*', 'schedule_*', create_goal, get_goal, update_goal, 'todo_*', workflow, exit_plan_mode, ask_user_question]
          - id: computer-use
            title: 电脑与软件操作
            description: 查看本机应用窗口与截图，根据任务点击、输入和滚动，再读取实际结果。
            tools: ['mcp__muse-computer__*']
          - id: research
            title: 搜索与技术分析
            description: 搜索网页资料、读取网页和分析技术问题。
            tools: ['web_*', 'reverse_*']
