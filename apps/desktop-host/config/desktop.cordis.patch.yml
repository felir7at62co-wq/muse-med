# Electron reuses the authenticated Web composition on an OS-assigned loopback port.

# The product speaks for itself: the harness identity line would tell every agent it
# is powered by the upstream harness, and a model repeats that to the team. The base
# bundle's own persona prefix is restated because a patch replaces the whole config.
- id: system-prompt
  config:
    personaPrefix: ''
    includeHarnessIdentity: false

# Unattended whole-series goals resume after a model outage, or after replies discarded by
# prompt-usage-guard, that outlasts provider retries.
- id: goal-round-driver
  config:
    transientErrorResume: { maxAttempts: 3, delayMs: 120000, codes: [SERVER, TIMEOUT, TRANSPORT, STREAM_CLOSED, PROMPT_USAGE_SHORTFALL] }

# New tasks use one unified creative Agent; legacy preset ids remain recoverable.
- id: agent-preset-registry
  config:
    default: short-drama
    selectablePresets: [short-drama, main-session]
    allowUserDefault: false

- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

# The upstream preset registry is the engine, and the product declares every preset itself: the
# composition directories under `presets/` become six rows through the adapter in src/index.ts, which
# knows the runtime directory holding them. The product therefore imports none of the base bundle's
# DSH user modes, and those shipped rows are disabled below because a deployment upgrade must not
# shadow a product preset of the same id.
# The base bundle ships one row per native coding mode. The product replaces all four ids with its
# own adapted compositions under `presets/`, so leaving these active would both shadow those rows
# and mount a second filesystem skill provider — the shipped `cordis`, `standard`, and `ptc`
# definitions carry their own row, and the last two select default roots, which only the Host
# provider may do.
- id: preset-cordis
  disabled: true

- id: preset-minimal
  disabled: true

- id: preset-ptc
  disabled: true

- id: preset-standard
  disabled: true

# All product agents inherit this Host provider. The runtime supplies its real bundled path.
- id: skill-filesystem
  disabled: false
  config:
    includeDefaultRoots: false
    includeProjectRoots: true
    excludedBundledSkills:
      - jubian-project-upload
      - jubian-snatch
      - tweet-drama-background-render
      - tweet-drama-core
      - tweet-drama-delivery
      - tweet-drama-draft-build
      - tweet-drama-early-shot-script
      - tweet-drama-key-manager
      - tweet-drama-project-bible
      - tweet-drama-project-inspect
      - tweet-drama-shot-asset-match
      - tweet-drama-voice-continuity

# These optional settings providers are not part of the Muse product.
- id: agent-notes
  disabled: true

- id: ui-settings-agent-notes
  disabled: true

# The dedicated Main Session entry and the short-drama default do not require a chooser.
- id: ui-agent-preset
  disabled: true

- id: entry-customization
  disabled: true

- id: ui-permission
  disabled: false

- id: ui-settings-models
  config:
    welcomeNotice: false

- id: ui-plan
  disabled: true

- id: ui-plugin-manager
  disabled: true

- id: ui-settings-plugins
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: web-startup
  disabled: false

# Muse search uses the account gateway; anonymous page fetching keeps its HTTP provider.
- id: web
  config:
    searchProvider: muse
    fetchProvider: http

# Muse feedback is delivered explicitly to its account inbox.
- id: session-log-deepseek
  disabled: true

- id: webserver
  disabled: false
  config:
    host: 127.0.0.1
    port: 0
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: web-runtime
  disabled: false
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: false
    trustedHosts: []

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: false

- id: ui-open-in-app
  disabled: false

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: jingliu-connection
      name: '@deepseek-ai/dsh-jingliu-connection'
      config:
        studioOrigin: !!js process.env.MUSE_JINGLIU_ORIGIN || (process.env.MUSE_BASE_URL || 'https://muse.aigc-pipeline.cn') + '/jingliu'
        localPreviewToken: !!js process.env.MUSE_JINGLIU_LOCAL_PREVIEW === '1'

    - id: tool-jingliu
      name: '@deepseek-ai/dsh-tool-jingliu'

    - id: ui-jingliu
      name: '@deepseek-ai/dsh-client-ui-jingliu'
      config:
        studioOrigin: !!js process.env.MUSE_JINGLIU_ORIGIN || (process.env.MUSE_BASE_URL || 'https://muse.aigc-pipeline.cn') + '/jingliu'
        workshopOrigin: !!js process.env.MUSE_SCRIPT_WORKSHOP_ORIGIN

    - id: muse-market
      name: '@deepseek-ai/dsh-muse-market'

    - id: muse-market-activation
      name: '@deepseek-ai/dsh-muse-market/activation'

    - id: muse-market-cloud
      name: '@deepseek-ai/dsh-muse-market/cloud'
      config:
        baseUrl: !!js process.env.MUSE_BASE_URL || 'https://muse.aigc-pipeline.cn'

    - id: ui-muse-market
      name: '@deepseek-ai/dsh-client-ui-muse-market'

    - id: muse-lvpaopao-bridge
      name: muse-lvpaopao/bridge

    # Windows x64 carries the reviewed driver payload in Desktop resources.
    - id: computer-use
      disabled: !!js process.platform !== 'win32' || process.arch !== 'x64'
      name: '@deepseek-ai/dsh-computer-use'

    - id: muse-computer-use
      disabled: !!js process.platform !== 'win32' || process.arch !== 'x64'
      name: '@deepseek-ai/dsh-desktop-host/computer-use'
      config:
        command: !!js process.env.MUSE_COMPUTER_USE_EXECUTABLE
        args: [mcp]

    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # Account credentials travel through the authenticated Settings Remote call.
    - id: muse-desktop-bridge
      name: '@wenbin_wb/dsh-bridge/remote'

    - id: muse-account
      name: '@deepseek-ai/dsh-muse-account'
      inject: [tools, llm, sessions, sessionProjections, agentDefaultModel, museDesktopBridge, connection, webServer]
      config:
        baseUrl: !!js process.env.MUSE_BASE_URL || 'https://muse.aigc-pipeline.cn'
        webSearch: true
        feedbackTools: true
        mediaTools: true
        # Douyin videos are downloaded only by the data station under this account origin.
        douyinDownloadTool: true
        mediaNodePath: !!js process.execPath
        mediaFfmpegPath: !!js process.env.DSH_FFMPEG_PATH || 'ffmpeg'
        mediaFfprobePath: !!js process.env.DSH_FFPROBE_PATH || 'ffprobe'
        excludedModelPrefixes: []
        excludedModels:
          - { providerId: yunying, modelId: claude-opus-5-5 }
          - { providerId: yunying, modelId: claude-fable-5-1 }
          - { providerId: yunying, modelId: gpt-6-astra }
          - { providerId: yunying, modelId: glm-5.3-flash }
        excludedProviderIds: ['aa']
        hiddenProviderIds: ['yunying']
        visibleModels:
          - { providerId: yunying, modelId: gemini-3.1-pro }
          - { providerId: yunying, modelId: gpt-6.1-sol }
        requestTimeoutMs: 60000
        # Gateway outages of a few minutes and replies discarded by prompt-usage-guard are retried
        # inside the same step; the list restates the defaults because it replaces them.
        modelRetryPolicy:
          mode: normal
          maxRetries: 8
          retryableCodes: [EMPTY_RESPONSE, INVALID_TOOL_ARGUMENTS, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, PROMPT_USAGE_SHORTFALL]
          backoff: { initialDelayMs: 2000, maxDelayMs: 60000 }
        remoteAccess: true

    # The Yunying gemini-3.1-pro relay intermittently answers from an upstream lane that drops tool
    # definitions and tool history. Discard such a tool-less reply before it is committed; the
    # muse-account model retry policy above resends the same request.
    - id: prompt-usage-guard
      name: '@deepseek-ai/dsh-prompt-usage'
      config:
        routes:
          - { provider: muse-cloud-yunying, model: gemini-3.1-pro, minToolSchemaRatio: 1.0, minEstimateRatio: 0.5 }

    - id: session-video
      name: '@deepseek-ai/dsh-session-video'
      config:
        ffmpegPath: !!js process.env.DSH_FFMPEG_PATH || 'ffmpeg'
        ffprobePath: !!js process.env.DSH_FFPROBE_PATH || 'ffprobe'

    - id: ui-muse-account
      name: '@deepseek-ai/dsh-client-ui-muse-account'
      config:
        feedbackUrl: !!js new URL('/feedback', process.env.MUSE_BASE_URL || 'https://muse.aigc-pipeline.cn').href

