# Electron reuses the browser composition without its network and browser-launch rows.

# The product speaks for itself: the harness identity line would tell every agent it
# is powered by the upstream harness, and a model repeats that to the team. The base
# bundle's own persona prefix is restated because a patch replaces the whole config.
- id: system-prompt
  config:
    personaPrefix: ''
    includeHarnessIdentity: false

# The independent product owns its roster; it does not import DSH user modes.
- id: agent-presets
  config:
    default: short-drama-local
    includeShippedRoot: false
    includeUserRoot: false

# All product agents inherit this Host provider. The runtime supplies its real bundled path.
- id: skill-filesystem
  disabled: false
  config:
    includeDefaultRoots: false

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # One host settings namespace, shared by desktop sessions. The per-script
    # budget defaults to ¥4000 and authorizes priced Jubian calls automatically.
    - id: drama-settings
      name: '@deepseek-ai/dsh-drama-settings'

    # Jubian also publishes Remote services consumed by Desktop Settings, so
    # it belongs on the Host rather than inside one agent preset.
    - id: tool-jubian
      name: '@deepseek-ai/dsh-tool-jubian'

# The bundled Feishu bridge is inert until this product's own settings namespace
# holds credentials: no QR app registration, no cross-instance sync, and no read
# of another deployment's sync directory. A patch replaces the whole config, so
# credentials are deliberately absent here and come from that namespace alone.
# Enabling it takes effect after a backend restart.
- id: feishu-channel
  config:
    enabled: false
    autoRegistration: false
    crossInstanceSync: false
    requireMention: true
    denyTools: [ask_user_question, exit_plan_mode]
