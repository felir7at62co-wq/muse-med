- id: agent-default-model
  config:
    provider: manuscript-cross-episode-fixture
    model: cross-episode-test-model
- id: llm-deepseek
  disabled: true
- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
- id: tool-result-pruner
  disabled: true
- id: tool-web
  disabled: true
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: cross-episode-test-parent
    - id: cross-episode-test-parent
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cross-episode-test-parent
        name: Cross-episode test parent
        description: Parent inherits the shipped headless tools.
        plugins: []
    - id: manuscript-cross-episode-fixture
      name: './fixture.mjs'
