- id: agent-default-model
  config:
    provider: manuscript-ptc-delivery-fixture
    model: selected-creative-model
- id: llm-deepseek
  disabled: true
- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
- id: tool-result-pruner
  disabled: true
- id: tool-web
  disabled: true
- insert:
    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: delivery-creation-ptc
    - id: manuscript-ptc-delivery-fixture
      name: './ptc.mjs'
