name: E2E (real model API)

# Muse validates its authenticated model relay with a dedicated ordinary account.
# The upstream and opted-in repositories retain the official DeepSeek protocol
# suite. Muse can also opt into that suite with DSH_RUN_REAL_API_E2E=true.
# Credentials reach only preflight and their corresponding test steps.
#
# Never use pull_request_target: untrusted PR code must not receive credentials.
# A same-repository branch is trusted even when the repository itself is a fork;
# Dependabot PRs remain keyless regardless of who triggers the run.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith'
          && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    name: e2e
    if: >-
      (github.repository == 'deepseek-harness/deepseek-harness'
      || github.repository == 'felir7at62co-wq/muse-med'
      || vars.DSH_RUN_REAL_API_E2E == 'true')
      && (github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'))
    timeout-minutes: 45
    steps:
      - name: Preflight (require Muse test account and model route)
        if: github.repository == 'felir7at62co-wq/muse-med'
        env:
          MUSE_E2E_BASE_URL: ${{ vars.MUSE_E2E_BASE_URL }}
          MUSE_E2E_PROVIDER: ${{ vars.MUSE_E2E_PROVIDER }}
          MUSE_E2E_MODEL: ${{ vars.MUSE_E2E_MODEL }}
          MUSE_E2E_USERNAME: ${{ secrets.MUSE_E2E_USERNAME }}
          MUSE_E2E_PASSWORD: ${{ secrets.MUSE_E2E_PASSWORD }}
        run: |
          set -euo pipefail
          for name in MUSE_E2E_BASE_URL MUSE_E2E_PROVIDER MUSE_E2E_MODEL MUSE_E2E_USERNAME MUSE_E2E_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty; Muse real API tests cannot self-skip."
              exit 1
            fi
          done

      - name: Preflight (require DEEPSEEK_API_KEY)
        if: github.repository != 'felir7at62co-wq/muse-med' || vars.DSH_RUN_REAL_API_E2E == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::error::DEEPSEEK_API_KEY_EXTERNAL is empty; official API tests cannot self-skip."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Build (lib for the e2e example bins)
        run: pnpm run build:official

      - name: Prepare Office runtime
        if: github.repository != 'felir7at62co-wq/muse-med' || vars.DSH_RUN_REAL_API_E2E == 'true'
        run: pnpm run prepare:primary-runtime --target linux-x64 --output .cache/e2e-office

      - name: E2E tests (real Muse API)
        if: github.repository == 'felir7at62co-wq/muse-med'
        env:
          MUSE_E2E_BASE_URL: ${{ vars.MUSE_E2E_BASE_URL }}
          MUSE_E2E_PROVIDER: ${{ vars.MUSE_E2E_PROVIDER }}
          MUSE_E2E_MODEL: ${{ vars.MUSE_E2E_MODEL }}
          MUSE_E2E_USERNAME: ${{ secrets.MUSE_E2E_USERNAME }}
          MUSE_E2E_PASSWORD: ${{ secrets.MUSE_E2E_PASSWORD }}
          DSH_E2E_MAX_WORKERS: 1
        run: pnpm run test:e2e packages/host/muse-account/tests/muse-gateway-live.e2e.ts --retry=0

      - name: E2E tests (real DeepSeek API)
        if: github.repository != 'felir7at62co-wq/muse-med' || vars.DSH_RUN_REAL_API_E2E == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/anthropic
          DSH_PRIMARY_RUNTIME: ${{ github.workspace }}/.cache/e2e-office/primary-runtime
          DSH_E2E_MAX_WORKERS: 4
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
