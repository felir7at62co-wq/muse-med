name: PR 128 keyless shutdown diagnostics

on:
  push:
    branches: [codex/pr128-snapshot-diagnostic]

permissions:
  contents: read

concurrency:
  group: pr128-snapshot-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: c5d81d55e70116775a4b633c1183d4c650ad72f3
  DSH_TELEMETRY_DISABLED: '1'
  DEEPSEEK_API_KEY: ''
  DSH_EXAMPLE_MODE: lib
  DSH_BUILD_CLIENT_PROFILE: official
  DSH_SNAPSHOT_MAX_WORKERS: '1'
  DSH_SNAPSHOT_MAX_CONCURRENCY: '1'

jobs:
  factory-shutdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the source checkpoint and isolated workflow
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          test "$(git diff --name-only "$SOURCE_COMMIT" HEAD)" = '.github/workflows/pr128-snapshot-diagnostics.yml'
          mkdir -p .local/pr128/factory-diagnostics
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"
          git rev-parse HEAD > .local/pr128/factory-diagnostics/workflow-commit.txt
          git rev-parse "$SOURCE_COMMIT" > .local/pr128/factory-diagnostics/source-commit.txt

      - uses: pnpm/action-setup@v6
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install frozen dependencies and prepare the existing sandbox
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile &
          install_pid=$!
          bash scripts/prepare-ci-bubblewrap.sh &
          sandbox_pid=$!
          install_status=0
          wait "$install_pid" || install_status=$?
          sandbox_status=0
          wait "$sandbox_pid" || sandbox_status=$?
          if (( install_status != 0 )); then exit "$install_status"; fi
          exit "$sandbox_status"

      - name: Build the exact source checkpoint
        run: pnpm run build

      - name: Freeze canonical Session inputs and the exact test selection
        run: |
          cat > .local/pr128/factory-diagnostic.mjs <<'NODE'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          import { mkdir, readFile, writeFile } from 'node:fs/promises'
          import { join } from 'node:path'

          const output = '.local/pr128/factory-diagnostics'
          const owner = 'snapshots/sdk/factory-shutdown'
          const title = 'SDK factory shutdown (POSIX SIGTERM) joins the active child before releasing inbox projections and closes both durable turns'
          const allowed = [
            `${owner}/writer.expected.jsonl`,
            `${owner}/writer.1.expected.jsonl`,
            `${owner}/result.expected.json`,
            `${owner}/system-prompt.1.expected.md`,
            `${owner}/tool-schemas.1.expected.json`,
          ]
          const canonicalName = /^session(?:\.[1-9]\d*)?(?:\.v[1-9]\d*)?\.jsonl$/u
          const git = args => execFileSync('git', args, { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 })
          const json = async name => JSON.parse(await readFile(join(output, name), 'utf8'))
          const save = (name, value) => writeFile(join(output, name), JSON.stringify(value, null, 2) + '\n')

          async function inventory() {
            const paths = git(['ls-files', '-z', '--', 'snapshots']).split('\0')
              .filter(path => canonicalName.test(path.split('/').at(-1))).sort()
            if (paths.length !== 718) throw new Error(`Expected 718 canonical Session files, found ${paths.length}`)
            return Object.fromEntries(await Promise.all(paths.map(async path =>
              [path, createHash('sha256').update(await readFile(path)).digest('hex')])))
          }

          function assertInventory(before, after) {
            if (JSON.stringify(before) !== JSON.stringify(after)) throw new Error('Canonical Session inventory or bytes changed')
          }

          function assertChangedPaths(paths) {
            const rejected = paths.filter(path => !allowed.includes(path))
            if (rejected.length > 0) throw new Error(`Unapproved changed paths: ${rejected.join(', ')}`)
          }

          function assertExecuted(report) {
            const cases = report.testResults.flatMap(file => file.assertionResults)
            if (cases.length !== 1 || cases[0].fullName !== title || cases[0].status !== 'passed') {
              throw new Error('The selected POSIX shutdown case must execute exactly once and pass')
            }
            return cases.map(test => ({ title: test.fullName, status: test.status }))
          }

          function selftest() {
            const assertion = { fullName: title, status: 'passed' }
            assertExecuted({ testResults: [{ assertionResults: [assertion] }] })
            assertInventory({ 'session.v4.jsonl': 'a' }, { 'session.v4.jsonl': 'a' })
            assertChangedPaths(allowed)
            const rejects = [
              () => assertInventory({ 'session.v4.jsonl': 'a' }, { 'session.v4.jsonl': 'b' }),
              () => assertChangedPaths([`${owner}/session.v4.jsonl`]),
              () => assertChangedPaths([`${owner}/runtime.mjs`]),
              () => assertExecuted({ testResults: [{ assertionResults: [{ ...assertion, status: 'skipped' }] }] }),
              () => assertExecuted({ testResults: [{ assertionResults: [{ ...assertion, fullName: 'other' }] }] }),
              () => assertExecuted({ testResults: [{ assertionResults: [assertion, assertion] }] }),
              () => assertExecuted({ testResults: [] }),
            ]
            for (const reject of rejects) {
              let rejected = false
              try { reject() } catch { rejected = true }
              if (!rejected) throw new Error('Guard negative control was accepted')
            }
          }

          if (process.argv[2] === 'freeze') {
            selftest()
            await mkdir(output, { recursive: true })
            if (git(['status', '--porcelain=v1', '--', 'snapshots']) !== '') {
              throw new Error('Diagnostic source corpus must be clean before execution')
            }
            const before = await inventory()
            await save('canonical-before.json', before)
            await save('selection.json', { file: 'snapshots/sdk/factory-shutdown.snapshot.ts', title, allowed })
            console.log(`Frozen ${Object.keys(before).length} canonical inputs; selected one exact POSIX case`)
          } else if (process.argv[2] === 'guard') {
            const before = await json('canonical-before.json')
            const after = await inventory()
            await save('canonical-after.json', after)
            assertInventory(before, after)
            const paths = git(['ls-files', '--modified', '--others', '--exclude-standard', '-z', '--', 'snapshots'])
              .split('\0').filter(Boolean)
            assertChangedPaths(paths)
            const phases = await json('phase-exits.json')
            const errors = []
            const executed = {}
            for (const phase of ['refresh', 'post-replay']) {
              try {
                if (phases[phase] !== 0) throw new Error(`${phase} exited ${phases[phase]}`)
                executed[phase] = assertExecuted(await json(`${phase}.json`))
              } catch (error) { errors.push(`${phase}: ${error.message}`) }
            }
            const summary = { canonicalFiles: Object.keys(before).length, canonicalUnchanged: true, paths, executed, errors }
            await save('summary.json', summary)
            if (errors.length > 0) throw new Error('No accepted patch: refresh and post-replay must both pass')
            const patch = git(['diff', '--binary', '--', ...allowed])
            await writeFile(join(output, 'review.patch'), patch)
            console.log(JSON.stringify({ ...summary, patchBytes: Buffer.byteLength(patch) }))
          } else if (process.argv[2] === 'selftest') {
            selftest()
            const report = JSON.parse(await readFile(process.argv[3], 'utf8'))
            try {
              assertExecuted(report)
              throw new Error('Windows skip was accepted')
            } catch (error) {
              if (error.message === 'Windows skip was accepted') throw error
              const cases = report.testResults.flatMap(file => file.assertionResults)
              if (cases.length !== 1 || cases[0].fullName !== title || cases[0].status !== 'skipped') throw error
            }
            const before = await inventory()
            assertInventory(before, await inventory())
            console.log(`Guard selftests passed with ${Object.keys(before).length} real canonical inputs and actual skipped POSIX title`)
          } else {
            throw new Error('Expected freeze, guard, or selftest')
          }
          NODE
          node .local/pr128/factory-diagnostic.mjs freeze

      - name: Run the real POSIX refresh and independent read-only replay
        run: |
          set +e
          DSH_SNAPSHOT=refresh pnpm exec vitest run --config vitest.snapshot.config.ts snapshots/sdk/factory-shutdown.snapshot.ts --reporter=json --outputFile=.local/pr128/factory-diagnostics/refresh.json 2>&1 | tee .local/pr128/factory-diagnostics/refresh.log
          refresh_status=${PIPESTATUS[0]}
          DSH_SNAPSHOT=replay pnpm exec vitest run --config vitest.snapshot.config.ts snapshots/sdk/factory-shutdown.snapshot.ts --reporter=json --outputFile=.local/pr128/factory-diagnostics/post-replay.json 2>&1 | tee .local/pr128/factory-diagnostics/post-replay.log
          post_status=${PIPESTATUS[0]}
          printf '{"refresh":%s,"post-replay":%s}\n' "$refresh_status" "$post_status" > .local/pr128/factory-diagnostics/phase-exits.json
          node .local/pr128/factory-diagnostic.mjs guard

      - name: Upload text-only review evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pr128-factory-shutdown-${{ github.sha }}
          path: .local/pr128/factory-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
