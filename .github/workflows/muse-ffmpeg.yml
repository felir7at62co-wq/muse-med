name: muse-med FFmpeg source build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-ffmpeg-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Dedicated Linux cross-build exception: BtbN requires Linux Docker, not Windows Docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/scripts/ffmpeg-source-build
      - name: Verify source packaging logic
        run: python3 -B apps/desktop/scripts/ffmpeg-source-build/test_build.py
      - name: Verify build tools
        run: |
          docker version
          docker buildx version
          bash --version
          df -h
      - name: Build binaries and matching sources
        run: python3 -B apps/desktop/scripts/ffmpeg-source-build/build.py build "$RUNNER_TEMP/ffmpeg-artifacts"
      - name: Upload the inseparable binary and source pair
        uses: actions/upload-artifact@v4
        with:
          name: muse-ffmpeg-win-x64
          path: ${{ runner.temp }}/ffmpeg-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  windows-smoke:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: apps/desktop/scripts/ffmpeg-source-build
      - uses: actions/download-artifact@v4
        with:
          name: muse-ffmpeg-win-x64
          path: ${{ runner.temp }}/ffmpeg-artifacts
      - name: Verify paired hashes and native encode/subtitle/probe behavior
        run: |
          python -B apps/desktop/scripts/ffmpeg-source-build/test_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B apps/desktop/scripts/ffmpeg-source-build/smoke.py "$env:RUNNER_TEMP/ffmpeg-artifacts"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
