name: Verify Muse 1.1.3 mirror
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node .github/scripts/readback-muse-113.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: muse-1.1.3-mirror-full-readback
          path: .release/mirror-full-verification.json
          if-no-files-found: error
          retention-days: 30
