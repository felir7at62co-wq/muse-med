name: Muse verified draft artifact transfer

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: muse-release-artifact-transfer-105
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'felir7at62co-wq/muse-med' && github.ref == 'refs/heads/codex/muse-release-artifact-transfer-105'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      MUSE_TRANSFER_SEAL: scripts/owner/muse-release-artifact-transfer/seal.json
      MUSE_TRANSFER_ROOT: ${{ runner.temp }}/muse-release-artifact-transfer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify isolated transfer tests
        run: node --test scripts/owner/muse-release-artifact-transfer/*.test.mjs
      - name: Require the successful source run and both approved drafts
        id: preflight
        run: node scripts/owner/muse-release-artifact-transfer/run.mjs --mode preflight --manifest "$MUSE_TRANSFER_SEAL"
      - name: Download the original Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.preflight.outputs.source_run }}
          name: muse-win-x64-${{ steps.preflight.outputs.source_commit }}
          path: ${{ env.MUSE_TRANSFER_ROOT }}/win-x64
      - name: Download the original Mac ARM installer artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.preflight.outputs.source_run }}
          name: muse-mac-arm64-${{ steps.preflight.outputs.source_commit }}
          path: ${{ env.MUSE_TRANSFER_ROOT }}/mac-arm64
      - name: Download the real Windows installation receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.preflight.outputs.source_run }}
          name: muse-win-x64-installed-acceptance-${{ steps.preflight.outputs.source_commit }}
          path: ${{ env.MUSE_TRANSFER_ROOT }}/acceptance/win-x64
      - name: Download the real Mac ARM installation receipt
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.preflight.outputs.source_run }}
          name: muse-mac-arm64-installed-acceptance-${{ steps.preflight.outputs.source_commit }}
          path: ${{ env.MUSE_TRANSFER_ROOT }}/acceptance/mac-arm64
      - name: Verify original bytes and supplement the two drafts
        run: node scripts/owner/muse-release-artifact-transfer/run.mjs --mode transfer --manifest "$MUSE_TRANSFER_SEAL" --artifacts-root "$MUSE_TRANSFER_ROOT"
