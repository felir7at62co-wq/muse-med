name: Publish verified Muse 1.1.1
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-muse-1.1.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'felir7at62co-wq/muse-med'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: felir7at62co-wq/muse-med
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38766474574
          name: muse-mac-arm64-63421116448b136b7bd66fb90e22f0fe704dbe80
          path: .release/mac-arm64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38766474574
          name: muse-win-x64-63421116448b136b7bd66fb90e22f0fe704dbe80
          path: .release/win-x64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38766474574
          name: muse-mac-arm64-installed-acceptance-63421116448b136b7bd66fb90e22f0fe704dbe80
          path: .release/acceptance/mac-arm64
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38766474574
          name: muse-win-x64-installed-acceptance-63421116448b136b7bd66fb90e22f0fe704dbe80
          path: .release/acceptance/win-x64
      - name: Verify native acceptance and artifact hashes
        run: node .github/scripts/prepare-muse-111.mjs
      - name: Publish the verified release and mirror
        env:
          MUSE_TOS_PLAN: ${{ secrets.MUSE_RELEASE_111_TOS_PLAN }}
        run: node .github/scripts/publish-muse-111.mjs
