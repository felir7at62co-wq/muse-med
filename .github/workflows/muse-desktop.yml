name: Muse isolated upgrade rehearsal

on:
  workflow_dispatch:
    inputs:
      target:
        description: Test platform
        type: choice
        options: [win-x64]
        default: win-x64
      upload_draft_release:
        type: boolean
        default: false
      export_candidate_to_tos:
        type: boolean
        default: false
      installed_upgrade_baseline:
        type: choice
        options: [all, '1.3.0']
        default: '1.3.0'
      installed_upgrade_run_id:
        description: Read-only artifact source run
        type: string
        default: '44241619032'
      installed_upgrade_source:
        description: Exact binary source commit
        type: string
        default: ba18143ec0f72a8a563e72d3421a1b1cdd909b8d
      installed_upgrade_version:
        description: Upgrade target version
        type: string
        default: '1.3.1'

permissions:
  contents: read
  actions: read

jobs:

  installed-upgrade:
    name: Installed Muse upgrade from ${{ matrix.from }}
    if: github.repository == 'felir7at62co-wq/muse-med' && github.event_name == 'workflow_dispatch' && inputs.installed_upgrade_run_id != ''
    runs-on: windows-2025
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        from: ${{ fromJSON(inputs.installed_upgrade_baseline == '1.3.0' && '["1.3.0"]' || '["1.3.0","1.3.1"]') }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26.13.0'
      - name: Install exact fixture dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Get the exact Windows candidate artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.installed_upgrade_run_id }}
          name: muse-win-x64-${{ inputs.installed_upgrade_source }}
          path: ${{ runner.temp }}/installed-upgrade-candidate
      - name: Get the distributed 1.3.1 baseline
        if: matrix.from == '1.3.1'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '44241619032'
          name: muse-win-x64-ba18143ec0f72a8a563e72d3421a1b1cdd909b8d
          path: ${{ runner.temp }}/installed-upgrade-baseline
      - name: Get the official 1.3.0 baseline
        if: matrix.from == '1.3.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.3.0 --repo $env:GITHUB_REPOSITORY --pattern 'muse-med-1.3.0-win-x64.exe*' --dir (Join-Path $env:RUNNER_TEMP 'installed-upgrade-baseline')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the installed application upgrade
        env:
          UPGRADE_FROM: ${{ matrix.from }}
          UPGRADE_TO: ${{ inputs.installed_upgrade_version }}
          UPGRADE_SOURCE: ${{ inputs.installed_upgrade_source }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baselineDirectory = Join-Path $env:RUNNER_TEMP 'installed-upgrade-baseline'
          $baseline = Join-Path $baselineDirectory "muse-med-$($env:UPGRADE_FROM)-win-x64.exe"
          $parameters = @{
            FromVersion = $env:UPGRADE_FROM
            BaselineInstaller = $baseline
            OldBlockmap = "$baseline.blockmap"
            CandidateArtifacts = Join-Path $env:RUNNER_TEMP 'installed-upgrade-candidate'
            TargetVersion = $env:UPGRADE_TO
            SourceCommit = $env:UPGRADE_SOURCE
            EvidenceDirectory = Join-Path $env:RUNNER_TEMP 'installed-upgrade-evidence'
          }
          ./qa/muse-installed-upgrade/installed-upgrade.ps1 @parameters
      - name: Retain only synthetic upgrade evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: muse-installed-upgrade-from-${{ matrix.from }}
          path: ${{ runner.temp }}/installed-upgrade-evidence/
          if-no-files-found: error
          retention-days: 7
