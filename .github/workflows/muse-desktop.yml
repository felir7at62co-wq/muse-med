name: Muse 1.1.6 sealed release transport

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Transfer the already accepted release; never build or publish
        type: choice
        options: [both, github, tos]
        default: both
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: muse-release-116-sealed-transport
  cancel-in-progress: false

jobs:
  transport:
    if: github.repository == 'felir7at62co-wq/muse-med' && github.ref == 'refs/heads/codex/muse-116-transport-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify offline transfer checks
        run: |
          python3 -B -m unittest discover -s .github/muse-release-116 -p test_transport.py
          node --test .github/muse-release-116/publish-tos-capability.spec.mjs
      - name: Fetch exact accepted CI bytes and sealed metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B .github/muse-release-116/transport.py --phase prepare --work-directory "$RUNNER_TEMP/muse-116-transport" --execute
      - name: Fill both GitHub drafts without publishing
        if: inputs.destination != 'tos'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B .github/muse-release-116/transport.py --phase github --work-directory "$RUNNER_TEMP/muse-116-transport" --workers 4 --execute
      - name: Transfer and verify only the scoped TOS capability
        if: inputs.destination != 'github'
        env:
          MUSE_RELEASE_116_TOS_PLAN: ${{ secrets.MUSE_RELEASE_116_TOS_PLAN }}
        run: >-
          node .github/muse-release-116/publish-tos-capability.mjs
          --manifest .github/muse-release-116/manifest.json
          --assets "$RUNNER_TEMP/muse-116-transport/assets"
          --receipt "$RUNNER_TEMP/muse-116-transport/receipts/tos-capability.json"
          --execute
      - name: Require complete public TOS readback
        if: inputs.destination != 'github'
        run: >-
          node --input-type=module -e
          'import { readFileSync } from "node:fs";
          const receipt = JSON.parse(readFileSync(process.argv[1], "utf8"));
          if (receipt.stage !== "published-verified" || receipt.binaries.length !== 5 || receipt.feeds.length !== 4)
          throw new Error("Incomplete TOS public readback");'
          "$RUNNER_TEMP/muse-116-transport/receipts/tos-capability.json"
      - name: Preserve sanitized transport receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-116-transport-receipts-${{ github.run_id }}
          path: ${{ runner.temp }}/muse-116-transport/receipts/
          if-no-files-found: warn
          retention-days: 7
