name: OCR native Linux diagnosis
on:
  push:
    branches: [codex/ocr-linux-diagnosis-20261114]
permissions:
  contents: read
concurrency:
  group: ocr-native-diagnosis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_COVERAGE_TEST_TIMEOUT_MS: '90000'
    steps:
      - name: Set runner-owned temporary paths
        run: |
          echo "NODE_COMPILE_CACHE=$RUNNER_TEMP/node-compile-cache" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "DSH_OCR_NATIVE_FFPROBE=$RUNNER_TEMP/ffprobe-fd-witness" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Configure pnpm cache
        id: store
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: Linux-node-24-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            Linux-node-24-pnpm-
      - name: Install immutable dependencies and native media
        id: install
        run: |
          pnpm install --frozen-lockfile
          sudo apt-get update
          sudo apt-get install --yes ffmpeg gcc
          ffmpeg -version
          ffprobe -version
          node -e "const os=require('node:os'); console.log(JSON.stringify({node:process.version,v8:process.versions.v8,cpus:os.availableParallelism(),cpu:os.cpus()[0]?.model,memory:os.totalmem()}))"
          mkdir -m 700 -p "$RUNNER_TEMP/ocr-native-evidence/native-fd-flags"
          cc -std=c11 -Wall -Wextra -Werror -O2 "-DWITNESS_DIR=\"$RUNNER_TEMP/ocr-native-evidence/native-fd-flags\"" .github/diagnostics/ffprobe-fd-witness.c -o "$RUNNER_TEMP/ffprobe-fd-witness"
          "$RUNNER_TEMP/ffprobe-fd-witness" -version
      - name: Check native standard-stream blocking before output consumption
        run: |
          mkdir -p .artifacts/ocr-native-diagnosis
          pnpm exec vitest run packages/subprocess/subprocess-local/tests/linux-execve.spec.ts packages/subprocess/subprocess-local/tests/linux-execve-stdio.spec.ts --maxWorkers=1 --no-file-parallelism --coverage --coverage.include=packages/subprocess/subprocess-local/src/linux-execve.ts --coverage.reportsDirectory=.artifacts/ocr-native-diagnosis/native-stdio-coverage 2>&1 | tee .artifacts/ocr-native-diagnosis/native-stdio.log
      - name: Capture the six original native probe cases
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          DSH_OCR_DIAGNOSTICS_DIR: ${{ runner.temp }}/ocr-native-evidence/single
          DSH_SUBPROCESS_NATIVE_FD_DIAGNOSTICS: ${{ runner.temp }}/ocr-native-evidence/single/fd-flags
        run: |
          mkdir -p .artifacts/ocr-native-diagnosis
          mkdir -p "$DSH_OCR_DIAGNOSTICS_DIR"
          pnpm exec vitest run packages/perception/tool-video-inspect/tests/inspection.spec.ts --maxWorkers=1 --no-file-parallelism -t 'decodes the complete|fractional batch boundary' 2>&1 | tee .artifacts/ocr-native-diagnosis/single.log
      - name: Publish the first native FD and probe evidence immediately
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ocr-native-single-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/ocr-native-evidence/single
            ${{ runner.temp }}/ocr-native-evidence/native-fd-flags
            .artifacts/ocr-native-diagnosis/single.log
            .artifacts/ocr-native-diagnosis/native-stdio.log
      - name: Compare three independent instrumented owner processes
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process'
          import { createWriteStream } from 'node:fs'
          import { mkdir, writeFile } from 'node:fs/promises'
          import { once } from 'node:events'
          import { join } from 'node:path'
          const root = '.artifacts/ocr-native-diagnosis'
          await mkdir(root, { recursive: true })
          await mkdir(join(process.env.RUNNER_TEMP, 'ocr-native-evidence'), { recursive: true })
          const run = async (worker) => {
            const log = join(root, 'worker-' + worker + '.log')
            const stream = createWriteStream(log, { flags: 'wx' })
            const args = ['exec', 'vitest', 'run',
              'packages/perception/tool-video-inspect/tests/inspection.spec.ts',
              'packages/perception/tool-video-inspect/tests/ocr.spec.ts',
              '--maxWorkers=1', '--no-file-parallelism', '--coverage',
              '--coverage.include=packages/perception/tool-video-inspect/src/ocr.ts',
              '--coverage.reportsDirectory=' + join(root, 'coverage-' + worker)]
            const child = spawn('pnpm', args, { stdio: ['ignore', 'pipe', 'pipe'],
              env: { ...process.env,
                DSH_OCR_DIAGNOSTICS_DIR: join(process.env.RUNNER_TEMP, 'ocr-native-evidence', 'worker-' + worker),
                DSH_SUBPROCESS_NATIVE_FD_DIAGNOSTICS: join(process.env.RUNNER_TEMP, 'ocr-native-evidence', 'worker-' + worker, 'fd-flags') } })
            child.stdout.pipe(stream, { end: false })
            child.stderr.pipe(stream, { end: false })
            let spawnError
            child.once('error', (error) => { spawnError = String(error) })
            const [code, signal] = await new Promise(resolve => child.once('close', (...values) => resolve(values)))
            const flushed = once(stream, 'finish')
            stream.end()
            await flushed
            return { worker, code, signal, spawnError, log }
          }
          const settled = await Promise.allSettled([run(1), run(2), run(3)])
          const results = settled.map((item, index) => item.status === 'fulfilled' ? item.value : { worker: index + 1, error: String(item.reason) })
          await writeFile(join(root, 'process-results.json'), JSON.stringify(results, null, 2) + '\n')
          console.log(JSON.stringify(results))
          if (results.some(item => item.code !== 0 || item.signal || item.error || item.spawnError)) process.exitCode = 1
          NODE
      - name: Retain original probe bytes, source media and process logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ocr-native-${{ github.sha }}
          retention-days: 7
          path: |
            ${{ runner.temp }}/ocr-native-evidence
            .artifacts/ocr-native-diagnosis
