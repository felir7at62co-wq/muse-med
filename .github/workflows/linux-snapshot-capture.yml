name: Temporary Linux snapshot capture

on:
  pull_request:
    paths:
      - .github/workflows/linux-snapshot-capture.yml
      - .github/workflows/linux-snapshot-capture-plan.json
      - scripts/prepare-ci-bubblewrap.sh
      - snapshots/session/headless.snapshot.ts
      - snapshots/session/muse-jianying-draft/draft-fixture.mjs
      - snapshots/session/muse-visualize/visualize-fixture.mjs
      - snapshots/sdk/account-provider-signout/snapshot.yml

permissions:
  contents: read

concurrency:
  group: linux-snapshot-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: >-
      github.event.pull_request.number == 154
      && github.event.pull_request.head.ref == 'fix/muse-ci-baseline-20261111'
      && github.event.pull_request.head.repo.full_name == github.repository
    name: Capture ${{ matrix.group }} owner outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - remaining-pins-and-consumers
          - remaining-legacy-writers
          - remaining-current-writers
          - retained-tools-writers
          - session-product-budget
    env:
      # Match normal CI before capturing path-dependent working-context counts.
      TMPDIR: ${{ runner.temp }}
      DSH_TELEMETRY_DISABLED: '1'
      DSH_EXAMPLE_MODE: lib
      DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
      DSH_SNAPSHOT_MAX_WORKERS: '1'
      SNAPSHOT_CAPTURE_GROUP: ${{ matrix.group }}
      DEEPSEEK_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/snapshot-capture-pnpm-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install immutable dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the same libraries used by normal replay
        run: pnpm run build:artifacts

      - name: Prepare approved production fixture dependencies
        if: ${{ matrix.group == 'remaining-current-writers' || matrix.group == 'session-product-budget' }}
        run: |
          set -euo pipefail
          node scripts/prepare-skill-panel-snapshot.mjs
          node third_party/plugins/muse-lvpaopao/scripts/build.mjs
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Build and verify the supported Landlock backend
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          pnpm --filter @deepseek-ai/node-addon-system-workspace run build:native
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { mkdirSync, mkdtempSync, readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { spawnSync } from 'node:child_process'
          import { grantArgs, launcherPath, probe } from './native/system/packages/entry/lib/index.js'
          const launcher = launcherPath(), enforcement = probe(launcher)
          assert.notEqual(enforcement, 'unusable', 'The host must enforce the supported Landlock backend')
          const root = mkdtempSync(join(process.env.RUNNER_TEMP, 'muse-landlock-functional-'))
          const writable = join(root, 'workspace'), denied = join(root, 'outside')
          mkdirSync(writable); mkdirSync(denied)
          const deniedFile = join(denied, 'unchanged.txt')
          writeFileSync(deniedFile, 'OUTSIDE_UNCHANGED')
          const script = `
            import assert from 'node:assert/strict'
            import { writeFileSync } from 'node:fs'
            import { join } from 'node:path'
            writeFileSync(join(process.argv[1], 'allowed.txt'), 'WORKSPACE_WRITE_OK')
            assert.throws(() => writeFileSync(process.argv[2], 'UNEXPECTED_OUTSIDE_WRITE'),
              error => error.code === 'EACCES' || error.code === 'EPERM' || error.code === 'EROFS')
          `
          const result = spawnSync(launcher, [...grantArgs({ readOnly: ['/'], readWrite: [writable] }), '--',
            process.execPath, '--input-type=module', '-e', script, writable, deniedFile], { encoding: 'utf8', timeout: 10_000 })
          assert.equal(result.status, 0, `Confined functional probe failed: ${result.stderr}`)
          assert.equal(readFileSync(join(writable, 'allowed.txt'), 'utf8'), 'WORKSPACE_WRITE_OK')
          assert.equal(readFileSync(deniedFile, 'utf8'), 'OUTSIDE_UNCHANGED')
          const evidence = { launcher, sha256: createHash('sha256').update(readFileSync(launcher)).digest('hex'),
            enforcement, workspaceWrite: true, outsideWriteDenied: true }
          writeFileSync(join(process.env.RUNNER_TEMP, 'muse-linux-sandbox-probe.json'), JSON.stringify(evidence, null, 2) + '\n')
          console.log(JSON.stringify(evidence))
          NODE

      - name: Retain approved metadata and every protected input
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { existsSync, lstatSync, readFileSync, readdirSync, readlinkSync, realpathSync, statSync, writeFileSync } from 'node:fs'
          import { createRequire } from 'node:module'
          import { dirname, isAbsolute, join, resolve, sep } from 'node:path'
          import { tmpdir } from 'node:os'
          import { execFileSync } from 'node:child_process'
          const { load } = createRequire(resolve('apps/desktop/package.json'))('js-yaml')
          const plan = JSON.parse(readFileSync('.github/workflows/linux-snapshot-capture-plan.json', 'utf8'))
          assert.equal(plan.version, 1); assert.equal(plan.temporary, true)
          assert.equal(plan.repository, 'felir7at62co-wq/muse-med'); assert.equal(plan.pullRequest, 154)
          assert.equal(plan.headBranch, 'fix/muse-ci-baseline-20261111')
          assert.deepEqual(plan.totals, { groups: 5, tests: 81, replayTests: 82, outputs: 214 })
          const approvedIds = ['remaining-pins-and-consumers', 'remaining-legacy-writers', 'remaining-current-writers',
            'retained-tools-writers', 'session-product-budget']
          assert.deepEqual(plan.groups.map(group => group.id), approvedIds)
          assert.equal(plan.groups.reduce((n, group) => n + group.expectedTests, 0), 81)
          assert.equal(plan.groups.reduce((n, group) => n + group.replay.expectedTests, 0), 82)
          assert.equal(plan.groups.reduce((n, group) => n + group.allowedOutputs.length, 0), 214)
          assert.equal(new Set(plan.groups.flatMap(group => group.allowedOutputs)).size, 214, 'Cross-group output overlap')
          assert.equal(process.env.TMPDIR, process.env.RUNNER_TEMP, 'Capture and normal CI must use runner-owned temporary storage')
          assert.equal(resolve(tmpdir()), resolve(process.env.RUNNER_TEMP))
          const spec = plan.groups.find(group => group.id === process.env.SNAPSHOT_CAPTURE_GROUP)
          if (spec === undefined) throw new Error('Unexpected capture group')
          const safePath = path => typeof path === 'string' && !isAbsolute(path) && !path.includes('\\')
            && !/[\0\r\n]/u.test(path) && path.split('/').every(part => part !== '' && part !== '.' && part !== '..')
          for (const path of [...spec.inventoryDirectories, ...spec.extraInputs, ...spec.allowedOutputs, ...spec.suites]) assert.ok(safePath(path), `Unsafe capture path: ${path}`)
          assert.equal(spec.config, 'vitest.snapshot.config.ts')
          assert.equal(spec.expectedTests, spec.owners.length)
          assert.equal(new Set(spec.owners.map(owner => owner.name)).size, spec.owners.length)
          assert.equal(new Set(spec.allowedOutputs).size, spec.allowedOutputs.length)
          assert.equal(spec.phases.reduce((n, phase) => n + phase.passedSuffixes.length, 0), spec.expectedTests)
          assert.deepEqual(spec.phases.flatMap(phase => phase.owners).sort(), spec.owners.map(owner => owner.name).sort())
          assert.deepEqual(spec.phases.flatMap(phase => phase.outputs).sort(), [...spec.allowedOutputs].sort())
          const replayOwners = [...spec.owners.map(owner => owner.name),
            ...(spec.id === 'remaining-pins-and-consumers' ? ['tool-call-turn from retained V3 input'] : [])]
          const suffix = name => ` ${name} through dsh --profile headless`
          const filter = names => ` (${names.join('|')}) through dsh --profile headless$`
          assert.equal(spec.replay.passedSuffixes.length, spec.replay.expectedTests)
          assert.deepEqual(spec.replay.passedSuffixes, replayOwners.map(suffix))
          assert.equal(spec.replay.filter, filter(replayOwners))
          for (const phase of spec.phases) {
            assert.deepEqual(phase.passedSuffixes, phase.owners.map(suffix))
            assert.equal(phase.filter, filter(phase.owners))
          }
          if (spec.id === 'retained-tools-writers') assert.deepEqual(spec.owners.map(owner => owner.name),
            ['muse-manuscript-user-revisions', 'muse-manuscript-user-revisions-pwsh'])
          const inventory = directory => {
            const stat = lstatSync(directory)
            if (!stat.isDirectory() || stat.isSymbolicLink()) throw new Error(`Input directory must be owned: ${directory}`)
            return readdirSync(directory).flatMap(name => {
              const path = `${directory}/${name}`, entry = lstatSync(path)
              return entry.isDirectory() && !entry.isSymbolicLink() ? inventory(path) : [path]
            }).sort()
          }
          const files = spec.inventoryDirectories.flatMap(inventory)
          const protectedPaths = [...new Set([...files.filter(path => !spec.allowedOutputs.includes(path)), ...spec.extraInputs])].sort()
          assert.deepEqual(protectedPaths, spec.expectedInputInventory, 'Protected input inventory drifted')
          assert.deepEqual(files.filter(path => /\/session(?:\.[1-9]\d*)?(?:\.v[1-9]\d*)?\.jsonl$/u.test(path)).sort(), spec.expectedCanonicalPaths)
          for (const [path, expected] of Object.entries(spec.expectedManifests)) assert.deepEqual(load(readFileSync(path, 'utf8')), expected, `Manifest drifted: ${path}`)
          for (const owner of spec.owners) {
            const manifest = load(readFileSync(`${owner.dir}/snapshot.yml`, 'utf8'))
            assert.equal(manifest.session, undefined)
            if (spec.id === 'retained-tools-writers') {
              assert.deepEqual(manifest.sessionFormat, { version: 4, coverage: ['retired-tools'] }, `Exact retired input required: ${owner.name}`)
              assert.equal(manifest.writerOutput, undefined)
            } else {
              assert.equal(manifest.writerOutput, true, `Retained writer required: ${owner.name}`)
              assert.equal(manifest.sessionFormat, undefined)
            }
            assert.equal(manifest.profile, spec.profile)
          }
          for (const path of spec.allowedOutputs) {
            assert.ok(spec.owners.some(owner => path.startsWith(`${owner.dir}/`)), `Output is not owned: ${path}`)
            assert.ok(!spec.expectedCanonicalPaths.includes(path)); assert.ok(!path.endsWith('/snapshot.yml'))
            if (!existsSync(path) && spec.newOutputs.includes(path)) { assert.ok(/\/writer(?:\.[1-9]\d*)?\.expected\.jsonl$/u.test(path)); continue }
            const parent = lstatSync(dirname(path)), stat = lstatSync(path)
            assert.ok(parent.isDirectory() && !parent.isSymbolicLink() && stat.isFile() && !stat.isSymbolicLink(), `Output must be regular: ${path}`)
          }
          const sha256 = path => createHash('sha256').update(readFileSync(path)).digest('hex')
          const identity = path => {
            const stat = lstatSync(path)
            if (stat.isSymbolicLink()) {
              const resolved = realpathSync(path)
              assert.ok(resolved.startsWith(resolve('.') + sep) && statSync(path).isFile(), `Unsupported input alias: ${path}`)
              return { kind: 'symlink', target: readlinkSync(path), resolved, sha256: sha256(path) }
            }
            assert.ok(stat.isFile(), `Unsupported input kind: ${path}`)
            return { kind: 'file', sha256: sha256(path) }
          }
          const identities = Object.fromEntries(protectedPaths.map(path => [path, identity(path)]))
          const sandboxProbe = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'muse-linux-sandbox-probe.json'), 'utf8'))
          assert.ok(['full', 'partial'].includes(sandboxProbe.enforcement) && sandboxProbe.workspaceWrite === true && sandboxProbe.outsideWriteDenied === true)
          writeFileSync(join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-inputs.json'), JSON.stringify({
            head: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), spec, identities, sandboxProbe,
          }, null, 2) + '\n')
          NODE

      - name: Refresh approved phases and freeze each completed pin
        id: refresh
        env:
          DSH_SNAPSHOT: refresh
        shell: bash
        run: |
          set -euo pipefail
          trap 'capture_exit_code=$?; echo "exit_code=$capture_exit_code" >> "$GITHUB_OUTPUT"' EXIT
          config=$(node --input-type=module -e 'import{readFileSync}from"node:fs";import{join}from"node:path";console.log(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"muse-linux-snapshot-inputs.json"),"utf8")).spec.config)')
          suites_text=$(node --input-type=module -e 'import{readFileSync}from"node:fs";import{join}from"node:path";console.log(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"muse-linux-snapshot-inputs.json"),"utf8")).spec.suites.join("\n"))')
          mapfile -t suites <<< "$suites_text"
          phase_ids=$(node --input-type=module -e 'import{readFileSync}from"node:fs";import{join}from"node:path";console.log(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"muse-linux-snapshot-inputs.json"),"utf8")).spec.phases.map(phase=>phase.id).join("\n"))')
          mapfile -t phases <<< "$phase_ids"
          for phase in "${phases[@]}"; do
            export SNAPSHOT_CAPTURE_PHASE="$phase"
            filter=$(node --input-type=module -e 'import{readFileSync}from"node:fs";import{join}from"node:path";console.log(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"muse-linux-snapshot-inputs.json"),"utf8")).spec.phases.find(phase=>phase.id===process.env.SNAPSHOT_CAPTURE_PHASE).filter)')
            pnpm exec vitest run --config "$config" "${suites[@]}" \
              --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/$phase-refresh-report.json" -t "$filter"
            node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { existsSync, lstatSync, readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const state = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-inputs.json'), 'utf8'))
          const phaseIndex = state.spec.phases.findIndex(phase => phase.id === process.env.SNAPSHOT_CAPTURE_PHASE)
          assert.ok(phaseIndex >= 0)
          const phase = state.spec.phases[phaseIndex]
          const report = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, `${phase.id}-refresh-report.json`), 'utf8'))
          const passed = report.testResults.flatMap(result => result.assertionResults).filter(test => test.status === 'passed')
          assert.equal(report.numPassedTests, phase.passedSuffixes.length); assert.equal(report.numFailedTests, 0)
          assert.equal(report.numFailedTestSuites, 0)
          assert.equal(passed.length, phase.passedSuffixes.length)
          assert.ok(phase.passedSuffixes.every(suffix => passed.filter(test => test.fullName.endsWith(suffix)).length === 1))
          const frozenPath = join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-phase-freezes.json')
          const prior = existsSync(frozenPath) ? JSON.parse(readFileSync(frozenPath, 'utf8')) : { outputs: {}, phases: [] }
          assert.deepEqual(prior.phases.map(record => record.id), state.spec.phases.slice(0, phaseIndex).map(phase => phase.id))
          const hash = path => {
            const stat = lstatSync(path)
            assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.size <= 10 * 1024 * 1024, `Invalid output: ${path}`)
            return createHash('sha256').update(readFileSync(path)).digest('hex')
          }
          for (const [path, expected] of Object.entries(prior.outputs)) assert.equal(hash(path), expected, `Earlier phase pin changed: ${path}`)
          const outputs = Object.fromEntries(phase.outputs.map(path => { assert.ok(!Object.hasOwn(prior.outputs, path)); return [path, hash(path)] }))
          writeFileSync(frozenPath, JSON.stringify({ outputs: { ...prior.outputs, ...outputs },
            phases: [...prior.phases, { id: phase.id, passed: passed.length, outputs }] }, null, 2) + '\n')
          NODE
          done

      - name: Freeze the complete approved output inventory
        if: ${{ steps.refresh.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { lstatSync, readFileSync, writeFileSync } from 'node:fs'
          import { join } from 'node:path'
          const state = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-inputs.json'), 'utf8'))
          const frozen = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-phase-freezes.json'), 'utf8'))
          assert.deepEqual(frozen.phases.map(phase => phase.id), state.spec.phases.map(phase => phase.id))
          assert.deepEqual(Object.keys(frozen.outputs).sort(), [...state.spec.allowedOutputs].sort())
          for (const [path, expected] of Object.entries(frozen.outputs)) {
            const stat = lstatSync(path)
            assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.size <= 10 * 1024 * 1024)
            assert.equal(createHash('sha256').update(readFileSync(path)).digest('hex'), expected)
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-refreshed.json'), JSON.stringify(frozen.outputs, null, 2) + '\n')
          NODE

      - name: Replay the approved cohort without refresh
        id: replay
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          DSH_SNAPSHOT: replay
        shell: bash
        run: |
          set -euo pipefail
          config=$(node --input-type=module -e 'import{readFileSync}from"node:fs";import{join}from"node:path";console.log(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"muse-linux-snapshot-inputs.json"),"utf8")).spec.config)')
          suites_text=$(node --input-type=module -e 'import{readFileSync}from"node:fs";import{join}from"node:path";console.log(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"muse-linux-snapshot-inputs.json"),"utf8")).spec.suites.join("\n"))')
          mapfile -t suites <<< "$suites_text"
          filter=$(node --input-type=module -e 'import{readFileSync}from"node:fs";import{join}from"node:path";console.log(JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"muse-linux-snapshot-inputs.json"),"utf8")).spec.replay.filter)')
          capture_exit_code=0
          pnpm exec vitest run --config "$config" "${suites[@]}" \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/replay-report.json" -t "$filter" || capture_exit_code=$?
          echo "exit_code=$capture_exit_code" >> "$GITHUB_OUTPUT"
          exit "$capture_exit_code"

      - name: Verify all protected inputs and collect only approved outputs
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          REFRESH_OUTCOME: ${{ steps.refresh.outcome }}
          REPLAY_OUTCOME: ${{ steps.replay.outcome }}
          REFRESH_EXIT_CODE: ${{ steps.refresh.outputs.exit_code }}
          REPLAY_EXIT_CODE: ${{ steps.replay.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { copyFileSync, existsSync, lstatSync, mkdirSync, readFileSync, readdirSync, readlinkSync, realpathSync, statSync, writeFileSync } from 'node:fs'
          import { dirname, join } from 'node:path'
          import { execFileSync } from 'node:child_process'
          const state = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-inputs.json'), 'utf8'))
          const spec = state.spec, directory = join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-capture')
          mkdirSync(directory)
          const inventory = directory => {
            const stat = lstatSync(directory)
            if (!stat.isDirectory() || stat.isSymbolicLink()) throw new Error(`Input directory changed: ${directory}`)
            return readdirSync(directory).flatMap(name => {
              const path = `${directory}/${name}`, entry = lstatSync(path)
              return entry.isDirectory() && !entry.isSymbolicLink() ? inventory(path) : [path]
            }).sort()
          }
          const protectedPaths = [...new Set([...spec.inventoryDirectories.flatMap(inventory)
            .filter(path => !spec.allowedOutputs.includes(path)), ...spec.extraInputs])].sort()
          const sha256 = path => createHash('sha256').update(readFileSync(path)).digest('hex')
          const identity = path => {
            if (!existsSync(path)) return null
            const stat = lstatSync(path)
            if (stat.isSymbolicLink()) return { kind: 'symlink', target: readlinkSync(path), resolved: realpathSync(path), sha256: statSync(path).isFile() ? sha256(path) : null }
            return stat.isFile() ? { kind: 'file', sha256: sha256(path) } : { kind: 'unexpected' }
          }
          const after = Object.fromEntries(protectedPaths.map(path => [path, identity(path)]))
          const differences = (a, b) => [...new Set([...Object.keys(a), ...Object.keys(b)])].filter(path => JSON.stringify(a[path]) !== JSON.stringify(b[path]))
          const inputDifferences = differences(state.identities, after)
          const gitPaths = args => execFileSync('git', args, { encoding: 'utf8' }).split('\0').filter(Boolean)
          const changed = [...new Set([...gitPaths(['diff', '--name-only', '-z', 'HEAD']), ...gitPaths(['ls-files', '--others', '--exclude-standard', '-z'])])].sort()
          const unexpectedChanges = changed.filter(path => !spec.allowedOutputs.includes(path))
          const invalidOutputs = spec.allowedOutputs.filter(path => !existsSync(path) || !lstatSync(path).isFile()
            || lstatSync(path).isSymbolicLink() || lstatSync(path).size > 10 * 1024 * 1024)
          const frozenPath = join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-refreshed.json')
          const frozen = existsSync(frozenPath) ? JSON.parse(readFileSync(frozenPath, 'utf8')) : {}
          const outputHashes = Object.fromEntries(spec.allowedOutputs.map(path => [path, invalidOutputs.includes(path) ? null : sha256(path)]))
          const replayOutputDifferences = differences(frozen, outputHashes)
          const summarize = path => {
            if (!existsSync(path)) return null
            const report = JSON.parse(readFileSync(path, 'utf8'))
            const tests = report.testResults.flatMap(result => result.assertionResults)
            return { passed: report.numPassedTests, failed: report.numFailedTests, failedSuites: report.numFailedTestSuites,
              passedNames: tests.filter(test => test.status === 'passed').map(test => test.fullName),
              failures: tests.filter(test => test.status === 'failed').map(test => ({ name: test.fullName,
                messages: (test.failureMessages ?? []).map(message => message.slice(0, 16_384)) })),
              suiteFailures: report.testResults.filter(result => result.status === 'failed').map(result => ({ name: result.name, message: (result.message ?? '').slice(0, 16_384) })) }
          }
          const matches = (result, suffixes) => result?.passed === suffixes.length && result.failed === 0 && result.failedSuites === 0
            && result.passedNames.length === suffixes.length
            && suffixes.every(suffix => result.passedNames.filter(name => name.endsWith(suffix)).length === 1)
          const reports = { refresh: spec.phases.map(phase => ({ id: phase.id, result: summarize(join(process.env.RUNNER_TEMP, `${phase.id}-refresh-report.json`)) })),
            replay: summarize(join(process.env.RUNNER_TEMP, 'replay-report.json')) }
          const phasePath = join(process.env.RUNNER_TEMP, 'muse-linux-snapshot-phase-freezes.json')
          const phaseFreezes = existsSync(phasePath) ? JSON.parse(readFileSync(phasePath, 'utf8')) : { outputs: {}, phases: [] }
          const phasesComplete = JSON.stringify(phaseFreezes.phases.map(phase => phase.id)) === JSON.stringify(spec.phases.map(phase => phase.id))
          const verificationPassed = inputDifferences.length === 0 && unexpectedChanges.length === 0 && invalidOutputs.length === 0
            && replayOutputDifferences.length === 0 && phasesComplete
            && process.env.REFRESH_OUTCOME === 'success' && process.env.REPLAY_OUTCOME === 'success'
            && process.env.REFRESH_EXIT_CODE === '0' && process.env.REPLAY_EXIT_CODE === '0'
            && reports.refresh.every((report, index) => matches(report.result, spec.phases[index].passedSuffixes))
            && matches(reports.replay, spec.replay.passedSuffixes)
          const outputs = []
          if (verificationPassed) for (const path of spec.allowedOutputs) {
            const destination = join(directory, path)
            mkdirSync(dirname(destination), { recursive: true }); copyFileSync(path, destination)
            outputs.push({ path, bytes: lstatSync(path).size, sha256: sha256(path) })
          }
          writeFileSync(join(directory, 'evidence.json'), JSON.stringify({
            head: state.head, group: spec.id, platform: process.platform, arch: process.arch, node: process.version,
            owners: spec.owners.map(owner => owner.name), config: spec.config, suites: spec.suites,
            refreshPhases: spec.phases, replayFilter: spec.replay.filter, expectedTests: spec.expectedTests,
            refreshOutcome: process.env.REFRESH_OUTCOME, replayOutcome: process.env.REPLAY_OUTCOME,
            refreshExitCode: process.env.REFRESH_EXIT_CODE, replayExitCode: process.env.REPLAY_EXIT_CODE,
            sandboxProbe: state.sandboxProbe, canonicalPaths: spec.expectedCanonicalPaths,
            manifestPaths: Object.keys(spec.expectedManifests), inputsBefore: state.identities, inputsAfter: after, inputDifferences,
            phaseFreezes, frozenOutputHashes: frozen, outputHashes, replayOutputDifferences,
            changed, unexpectedChanges, invalidOutputs, reports, verificationPassed, outputs,
          }, null, 2) + '\n')
          if (!verificationPassed) throw new Error('Capture failed verification; only diagnostic evidence was retained')
          NODE

      - name: Retain the bounded capture and evidence
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-snapshot-capture-${{ matrix.group }}-${{ github.sha }}
          path: ${{ runner.temp }}/muse-linux-snapshot-capture/
          if-no-files-found: error
          retention-days: 3
