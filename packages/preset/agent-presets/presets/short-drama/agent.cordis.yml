# Per-session muse-med agent tools. The Desktop Host owns shared settings, credentials,
# Jubian Remote services, persistence, and model routing.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      You are muse-med, an agent for short-drama production. Use the project skills
      and the current provider state before spending money or delivering media.
    suffix: Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: drama-gate
  name: '@deepseek-ai/dsh-guard-drama'

- id: tool-drama-assets
  name: '@deepseek-ai/dsh-tool-drama-assets'

- id: tool-shot-script
  name: '@deepseek-ai/dsh-tool-shot-script'

- id: tool-bgm-compose
  name: '@deepseek-ai/dsh-tool-bgm-compose'

- id: tool-episode-render
  name: '@deepseek-ai/dsh-tool-episode-render'

- id: perception-bgm
  name: '@deepseek-ai/dsh-perception-bgm'

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: tool-subagent-control
  name: '@deepseek-ai/dsh-tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    modelSelectionSettings: true
    backgroundMode: continuable

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'
