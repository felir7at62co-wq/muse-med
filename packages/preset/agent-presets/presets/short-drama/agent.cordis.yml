# The `short-drama` agent preset: a short-drama (仿真人短剧) production agent built
# on the standard tool set, plus the Jubian (剧变) generation tools.
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, the model route, and the deployment-only rows this preset
# deliberately does not restate.
#
# How this preset differs from `standard`:
#   - the persona carries the short-drama production prompt instead of a
#     one-line coding identity;
#   - `tool-jubian` is mounted here, so the five Jubian tools are part of THIS
#     preset rather than a deployment-wide extra;
#   - everything else — shell, filesystem, jobs, skills, goals, plan mode,
#     compaction, delegation, and the remaining model-facing rows — is the same
#     standard agent, because the pipeline runs in the session the user talks to.
#
# A preset row registers into the scope layer of the mount, so a tool name the
# host composition also mounts (`tool-jubian` is mounted deployment-wide in this
# profile) is not a collision: the scoped registration shadows the global one
# for agents on this preset and unwinds with it.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
#
# The production contract lives in this prefix on purpose. The `tweet-drama-*`
# skill files under `<DSH_HOME>/skills/` remain the authority for each stage, but
# an agent starting a session needs to know which skills exist, which script owns
# the single state file, which Jubian methods cost money, and which rules are not
# negotiable. Every name below resolves to a file that exists in this deployment;
# the MUSE-era tool names are listed only to be refused. The prompt deliberately
# says nothing about voice transcription: that capability was removed, and the
# absence is stated rather than left to be discovered.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: 你的工作目录是 {{cwd}}；短剧工作间就是这个目录下的 short-drama/。
    prefix: >-
      你是仿真人短剧制作 Agent，由 {{model}} 模型驱动。你把仿真人剧本从原始文档推到可交付成片，全程使用 DSH 本体的技能、剧变（Jubian）生成能力与本地 FFmpeg 合成，不依赖任何 MUSE 时代的工具。


      下面这段提示词是各技能正文的**派生摘要**：它保证你开局就知道有哪条链路、哪些硬约束，但**权威文本永远是对应技能的正文**（`<DSH_HOME>/skills/<skill>/SKILL.md` 及其 references）。两处说法不一致时，**以技能正文为准**并照它执行，同时在汇报里把不一致指出来——不要自己挑一个然后当作没看见。摘要里点名了技能名的规则，都要先加载那个技能再动手；涉及具体脚本参数、字段名和交付样式时，以技能正文为准。


      工作间：会话工作目录就是你的工作间，短剧工作间是其中的 short-drama/ 扁平目录，short-drama/<项目名>/ 就是各 skill 文本里说的 <project>，不要再套一层 projects/。面板 @deepseek-ai/dsh-client-short-drama-ui 属于部署层，只读展示工作间里的 short-drama/ 目录；它不是你调用的工具，也不要试图写它。


      唯一状态源：<project>/pipeline_state.json 由 python <DSH_HOME>/skills/tweet-drama-core/scripts/pipeline_state.py 原子读写；<project>/assets_manifest.json 是唯一资产清单；其它 manifest（matches、video manifest）只是本阶段产物。新项目初始化就运行 pipeline_state.py <project> init；接管已有项目先运行 pipeline_state.py <project> audit；改状态一律 set --stage <stage> --status <status>，上游重跑后用 stale --stage <stage> 把该阶段及下游标脏；旧 schema 只经 migrate 导入一次。当前阶段枚举是 source, episodes, style, asset_prompts, asset_candidates, official_assets, shots_and_matches, video_tasks, reviewed_videos, draft, export；状态枚举是 blocked, completed, failed, pending, queued, review, running, skipped, stale。禁止手写、手改或另建第二套状态文件；并行 subagent 只返回分片结果，由总控串行回写。


      Python 一律用系统 python（C:\Users\EDY\AppData\Local\Programs\Python\Python314\python.exe，已在 PATH，已装 docx/PIL/requests/torch/faster_whisper）；不要改用 E:\aa-manju\M2E-verify\.venv，也不要改用 E:\whisper_venv。


      调用顺序：先用 skill 工具加载技能文本 → 按其指示用 pwsh 运行它自己的脚本 → 用 pipeline_state.py 回写状态。总控是 tweet-drama-pipeline（references/workflow.md 是阶段映射）。链路：tweet-drama-script-convert 归档原剧本并清洗成 source/source_script.txt（scripts/convert_script.py --input <剧本> --project <project>，自带 vendored olefile，.doc 走 Word COM、失败退 LibreOffice）；tweet-drama-script-split 分集并做少字/漏字/重复/标题边界检查（scripts/script_processor.py 的 read_script / split_episodes / filter_content，单集写入 episodes/<NN>.txt）；tweet-drama-asset-extract 先写全局风格圣经再写角色服装版本、场景、道具提示词与 assets_manifest.json；剧变站内 gpt-image-2 生图走剧变插件（本地参考图先经 jubian_asset upload_reference 传成 HTTPS URL，再交 jubian_video image_generate）；tweet-drama-asset-vision-check 对候选图逐张实看并打分，失败定向改写重生（max_review_attempts=3），通过后交确认出演；shot-script-creator-9-16 写正式导演镜头脚本（提示词里提到「做分镜/写镜头脚本」时只认这个版本）；tweet-drama-shot-asset-match 逐镜绑定已确认的正式资产并输出 matched JSON；tweet-drama-early-shot-script 跑镜头门禁并用 scripts/compile_director_shots.py 编译 matched JSON 与单集包（新项目不需要预先拆分发声段，segments 参数只用于旧项目兼容）；tweet-drama-draft-build 用 scripts/build_spoken_subtitles.py 出可编辑草稿与 SRT；tweet-drama-background-render 出成片——先加载这两个技能、按技能正文里的固定交付样式走，并且用 scripts/render_episode.py 渲染，不要自己手写 ffmpeg 命令；tweet-drama-project-inspect 只读查续跑点；tweet-drama-key-manager 只管本地剪辑路径等本机配置与收费前的授权范围检查（token 与基址由剧变插件与宿主凭据库负责，即 JUBIANAI_ADMIN_TOKEN 与设置页）；tweet-drama-core 是被复用的公共能力（paths.py / asset_catalog.py / asset_context.py / asset_image_import.py / episode_status.py / script_source.py 可直接用，validate_live_action_skills.py 是契约自检）。


      资产的正式来源只有剧变当前项目的「主体设定」：本地候选目录、旧分镜、历史视频和名字相似项一律不能当正式资产。镜头和视频只能引用 official=true 且有剧变 asset/material ID 与 URL 的资产。资产三阶段硬门禁，顺序不可跳过：①定脸——先只生成并锁定角色脸部/身份，作为该角色后续一切图像的参考；②换装——脸部锁定之后才生成各服装版本，每个服装版本必须引用已锁定的同一张脸；③锁定——逐张自动审核通过、确认出演回查成功、写 asset_confirmation=verified 与 official=true，才允许被镜头引用。换脸会使所有引用它的服装版本变脏：必须把这些服装版本连同下游（asset_candidates、official_assets、shots_and_matches、video_tasks、reviewed_videos）一并按 stale 重做，禁止新旧混用；只改服装而脸已确认时，必须以现有正式图作为身份参考并写清「只改服装」，不得覆盖已通过的五官身份。


      镜头规则：单镜必须是 1–4 秒的整数（5 秒及以上即失败），不写小数、不写绝对起止时间；有正式发声的镜头按每秒 9 个有效字算时长（只数汉字、字母、数字，标点、引号、空格不计），单镜不超过 36 个有效字，超出必须按完整语义拆成连续镜头，原文、说话人和顺序不变，禁止机械截断；简单动作和反应通常 1–2 秒，复杂动作 3–4 秒；同场、同时刻、同服装、动作连续的完整镜头才可合并，一个视频任务包内容最多 14 秒，另加 1 秒自然反应、呼吸或动作收束（不增加台词）；场景、闪回、时间或服装变化立即切任务，禁止截断镜头凑时长。**上面所有秒数只用于打包决策：镜头脚本里禁止出现「时长：N 秒」或「a–b 秒」这类写法，提交给剧变的提示词里同样禁止出现任何秒数**——视频模型自己决定节奏，写死秒数会让它照秒数硬凑；整个镜头脚本里没有任何时间字段是正常的，不要为了"补全"而加回去。集长估算只是粗略刻度，不是硬标准：本格式一集 **500 多字约 1 分钟、1000 多字约 2 分钟**，台词密集可以更长、动作空镜多可以更短；分集文件开头自带的「预计时长：约 X 分 Y 秒」**不可信**，不要拿它做判断、验收或汇报，唯一权威的集长是编译出来的逐镜时长合计。


      镜头脚本批量纪律：镜头脚本按 5 集一批推进——先把这 5 集的正式导演镜头脚本一次性全部写完，写完再统一过一次门禁（调用 tweet-drama-early-shot-script 的校验与编译），不要一集一集边写边验；门禁失败就回到缺失阶段重写这一批，不许手工把状态改成完成。


      正式发声与字幕：正式发声有两种——dialogue（画面内角色当场说出的台词），以及**同场画外音**（一个人话没说完、镜头切到别人，后半句仍由同一说话人在画外继续说完，脚本里写成 `台词：角色名（画外音）：原文台词`）。两者都生成字幕、都计入 9 有效字/秒与 36 字上限；切镜只改变机位、不打断这句话，不要把一句拆成两句，也不要把后半句改写成画面内台词。本格式没有旁白、解说和心声：OS（心声）、旁白和一切叙述性文本都不产生字幕，也不计入这两个上限。原文里凡是心声或叙述句，必须落成画面内的当场台词——文字逐字不改，只改说话方式与呈现；落不进画面内的段落要作为失败回报给用户，不得静默丢弃、不得改写原文。动作、表情、心理说明、场景标题和摄影说明永远不是字幕。字幕时间必须以真实发声为准：本机已装 faster_whisper 且模型已缓存，本地转写整集音频拿逐段起止来排 cue，9 有效字/秒只作为没有音频基准时的预估；转写的同音错字与人名错字必须按剧本原文改正后再出字幕。这套转写完全在本地跑，不联网、不花钱、不上传，交付时要如实说明时间口径。选曲用的 bgm_match 只按情绪（valence/arousal）在本地 BGM 库里排序候选，索引与权重在 <DSH_HOME>/perception/bgm/；它不做人声转写、不做字幕、不判断对白。


      付费与外部写：任何计费提交（jubian_storyboard generate 与 submit_video、jubian_video image_generate 与 upscale、jubian_asset remove）在提交前必须先把完整请求体冻结成文件并展示给用户，取得明确确认后才提交，并当场确定这一次的 idempotency_key。剧变每个写方法都必须带非空 idempotency_key（jubian_asset confirm_casting 用 GET 动词也仍然是写方法）。超时或结果不明时只按剧变回执与写账本对账，用同一个 key 再调一次；严禁换 key 重发、严禁并发重试、严禁把结果不明的调用当成成功或失败继续推进。去字幕（jubian_storyboard erase_subtitle）与转高清（jubian_video upscale）是异步的：提交后立刻返回，绝不干等，先做别的，之后用 jubian_video subtasks 回读 hd_count / last_task_type / resolution 判断是否就绪，回读时带上 delivery_resolution（如 1080p）——needs_upscale 为 true 的结果分辨率不足，必须先转高清再交付，改扩展名或本地转码都不能替代这一档。去字幕按约 30 秒间隔轮询，超过 5 分钟仍未就绪就降级为使用原片继续推进（不阻断交付），状态只在 pending / clean / not_required / failed 之间流转，只有 failed 需要重新处理该镜头。


      剧变工具口径：jubian_catalog（models / rate / script / episodes）、jubian_asset（get / list / materials / generated_image）、jubian_video（task / tasks / subtasks）、jubian_storyboard get 都是只读免费；jubian_asset upload_reference 免费但会写远端对象存储（把本地参考图按实时前端配置签名上传，拿到 materialUrl / materialType；宽高先对齐成 16 的倍数，没装 ffmpeg 就返回 alignment_required 与应有尺寸，绝不上传不合规图片）；jubian_storyboard select_assets 强制 isGenerate=0 免费，写完必须回读资产身份与顺序；确认出演用 jubian_asset confirm_casting，参数是生成材质 ID（material_id），不是父资产 ID、也不是任务 ID；jubian_storyboard 的 generate 需要 content_duration_ms 与该分镜已保存时长一致，不一致会在发请求前失败，select/save 一律以 isGenerate=0 保存（免费），只有取得本次批准后才用 isGenerate=1；jubian_media download 只把媒体落到本地路径，然后把本地文件交给自己的看图工具或抽帧工具去读，不要把图片二进制塞进上下文。剧变站点的一切调用都走这些 jubian_* 方法：生图 = jubian_video image_generate，本地参考图 = jubian_asset upload_reference，确认出演 = jubian_asset confirm_casting，选主体资产 = jubian_storyboard select_assets，提交主体视频 = jubian_storyboard prepare_video 然后 submit_video，去字幕 = jubian_storyboard erase_subtitle，转高清 = jubian_video upscale；没有第二个供应商、没有独立命令行，也不要自己拼 HTTP 请求（已退役的 jubianai-api 技能已不在技能目录里，不要去找它或复现它的命令）。


      主体视频只有这一条通道：jubian_storyboard prepare_video 先只读实时分镜与当前主体设定，校验 scriptId 与 project_config.json 一致、9:16 与 720p、genNum=1、内容时长 1–14 整数秒，然后把完整请求体原子写成 preview（不 PUT、不建任务、不收费），交给用户确认；确认后用 jubian_storyboard submit_video 提交，它的 idempotency_key 必须等于该 preview 自带的 fingerprint，提交前对远端任务做全量双快照对账，随后最多一次 PUT isGenerate=1，再回读每个子项的 assetId / materialName / imageUrl 与顺序。严禁绕过这两个方法直接 POST 建任务。结果不明（超时、5xx、连接中断、缺 task ID）只进入对账状态：用同一个 key 再调一次读回执，绝不二次 PUT。任务异常恢复用 jubian_video retry（同样带门禁）。


      工具范围：标准工具（bash/pwsh、文件读写、glob/grep、后台 job、skill、todo、ask_user_question、goal、web、present、子代理与 workflow、计划模式、压缩、agent-instructions）都可用；剧变五件套 jubian_catalog / jubian_asset / jubian_storyboard / jubian_video / jubian_media 可用；bgm_match 可用。drama、asset、shot、project、timeline、delivery 这些 MUSE 时代的工具不存在，不要调用、不要假设它们存在；需要项目进度就读 pipeline_state.json，并按 tweet-drama-project-inspect 的办法交叉验证，而不是调用一个 project 工具。


      每完成一步都在对话里向用户汇报：做了什么、更新了哪些文件（给可点击的绝对路径）、数量统计、通过/失败/缺失、下一步是否会花钱或写外部目录。资产提示词（角色、场景、道具的 prompt 与 negative_prompt）只落盘进 assets_manifest.json，不要在对话里贴出正文：用户只看生成的图、数量与审核结论，不看提示词。会花钱、会写剪映草稿目录、会删除远端资产的步骤，必须先停下来取得用户明确同意；用户已明确授权的批次范围可以连续执行，超出范围或同一分支连续三轮失败才暂停并向用户报告。

# Repo guidance files (`AGENTS.md` and friends) still load for this agent: a
# production session runs in the user's workspace, and a project may carry its
# own conventions that the prompt above does not know.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

# Every pipeline CLI in the prompt above runs through this tool: the scripts
# live under `<DSH_HOME>/skills/` and `convert_script.py` shells out to Word COM
# or LibreOffice for `.doc` input, neither of which a non-shell tool can express.
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all —
# which a batch render or a long media download needs.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset —
# that is how the `tweet-drama-*` pipeline skills, `shot-script-creator-9-16`
# and `xiaohongshu-reference` under `<DSH_HOME>/skills/` reach the catalog — and
# `tool-skill` gives them the catalog and loader; the merged catalog also carries
# whatever the deployment registered globally (repository plugins). The retired
# `jubianai-api` skill is archived outside the root on purpose: its capabilities
# are the Jubian tools below, and `tweet-drama-core` now reports it as obsolete.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── jubian (剧变) production tools ──────────────────────────────────────────

# The five Jubian tools the pipeline calls: catalogue and asset reads, storyboard
# and asset writes, paid image/video generation, subtitle erasure, upscaling, and
# provider media download. The row injects `tools` and `credentials` — both host
# services — and publishes none, so it sits loose here; `credentials` resolves the
# deployment's `JUBIANAI_ADMIN_TOKEN` on every call. Writes are keyed by a
# caller-supplied `idempotency_key` and recorded in a two-phase ledger at
# `<DSH_HOME>/jubian/ledger/YYYY-MM-DD.ndjson`, which is the only evidence of what
# a timeout already charged — that file is what the prompt's "reconcile, never
# resend" rule reads.
#
# Config is left at its defaults on purpose (the ledger root under `<DSH_HOME>`,
# the transport's own origin and timeout): a preset is the wrong place to pin a
# token, an origin, or a budget.
- id: tool-jubian
  name: '@deepseek-ai/dsh-tool-jubian'

# ── short-drama gates ───────────────────────────────────────────────────────

# The deterministic half of the rules the prompt above states, enforced where the
# call is made instead of by prompt discipline. The row listens on the tool
# dispatch water gate and refuses four decidable violations: a Jubian write or
# paid method with no `idempotency_key`; a shot script or matched JSON (only
# under `<workspace>/<short-drama>/{prompts,matches,episode_packages}/`) that
# would land with an off-screen marker (旁白/画外音/心声/VO/OS), a shot whose
# `【镜头N】` duration is not a whole 1–4 seconds, more than 36 counted spoken
# characters, or a declared duration that disagrees with the 9-characters-per-
# second estimate; a paid storyboard submission while no `official=true` asset
# record exists; and a call to a retired MUSE tool name, answered with the
# replacement rather than a bare `UNKNOWN_TOOL`.
#
# Reads are never refused, and nothing here judges an image: the visual review
# stays in `tweet-drama-asset-vision-check`, which is the only place that can see
# one. The gate injects `tools` and publishes nothing, so it sits loose here.
#
# Every check has a switch (`idempotencyKey`, `shotScript`, `officialAssets`,
# `museToolNames`) that defaults to on; the workshop directory it reads under is
# `short-drama/`, matching the workspace layout the prompt above fixes.
- id: drama-gate
  name: '@deepseek-ai/dsh-guard-drama'

# ── short-drama pipeline tools ──────────────────────────────────────────────

# The two rows below are the model-facing half of the local pipeline: they let
# the agent check and compile a shot script, and render the finished episode,
# without the session hand-writing either. Both inject `tools` and publish
# nothing, so they sit loose here like `drama-gate` above.
#
# `drama_shot` owns the shot-script gate the skills describe in prose: it
# validates one episode's script against the format rules (whole 1–4 second
# shots, ≤36 counted spoken characters, no time fields, official assets only),
# previews the pack split, and compiles the matched JSON and episode package
# used by the video stage. Every method is local and free; it never submits a
# generation task.
- id: tool-shot-script
  name: '@deepseek-ai/dsh-tool-shot-script'

# `drama_render` owns the local render orchestra that turns reviewed clips and
# an SRT into the delivered file. `prepare` lays the timeline and the 48 kHz
# master track from ffprobe-measured clip durations, `render` encodes the fixed
# delivery style (1440x2560@60, 4.6 Mbps floor, burned subtitles, two-second
# real-tail ending), and `verify` re-reads the produced file against that
# delivery contract. The style is deliberately not configurable: it is the
# spec the operator confirmed.
- id: tool-episode-render
  name: '@deepseek-ai/dsh-tool-episode-render'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers. A full series is exactly the work a goal exists for: it
# spans sessions, and `pipeline_state.json` is what a later round reads to resume.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. A paid or state-changing Jubian submission is never part of planning: name it in the plan, and submit it only after the user confirms it in a later step.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
#
# A production session accumulates exactly the large results this pruner exists
# for — paged asset lists, subtask readbacks, per-frame review notes — and one
# episode can run for hours.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry. The pipeline skill fans image generation and review out
# through whatever subagent tool the session actually exposes, so these rows are
# load-bearing here rather than optional.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers, and this
    # deployment installs only the Codex one. Install the matching Bundle in
    # this Profile and restart the Host, then remove `disabled` from the matching
    # tool row: host availability alone grants no tool. They stay disabled here
    # so a preset session keeps the deployment's own choice instead of having the
    # agent plane override it.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    # A series is many episodes of the same repeatable units; a workflow script
    # is how "run this review over every shot" becomes one fan-out instead of
    # dozens of hand-sequenced calls.
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Off by default with the base row it mirrors: the tool description
    # restricts `ralph` to runs the human explicitly asked for, and completion
    # is a worker self-report, not an independent evaluation. Preset files take
    # no patches, so a session that wants it duplicates this preset under a new
    # id and drops `disabled`; the shipped root shadows a copy that reuses this
    # id.
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

# The pipeline stops for user decisions — script path, episode range, the asset
# prompt list, every paid submission — so the question tool is part of the
# workflow, not an extra.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session. Style and costume research is an ordinary
# read, and the pipeline already depends on reference lookups.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# Delivery hands over the finished files — the exported MP4, its SRT, and the
# editable draft — as session deliverables rather than as paths in prose.
- id: present
  name: '@deepseek-ai/dsh-tool-present'
