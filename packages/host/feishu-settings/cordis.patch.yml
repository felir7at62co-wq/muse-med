# 飞书设置插件的组合包补丁：把插件行插入 composition。
#
# 这一行同时挂载 Host 半（`feishu` 设置段 + `feishuSetup` Remote 服务）与 Client 半
# （「设置 → 飞书」页）。行 id 就是设置命名空间：本行自身的 Config（`enabled`）既是
# 产品开关，也是桌面组合的 feishuGateLayer 读的那一份，所以这里不写第二份开关，
# 用户值由 profile 补丁层存进本行。
#
# 示例（profile 的 cordis.patch.yml 或 preset）：
#   - id: feishu
#     name: '@deepseek-ai/dsh-feishu-settings'
#
- insert:
    - id: feishu
      name: '@deepseek-ai/dsh-feishu-settings'
