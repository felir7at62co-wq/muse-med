# Alembic 配置 (drama orchestrator)
# 迁移脚本只改 schema, 绝不触碰 uploads/ 等文件数据。
[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url 留空: 真正的连接串在 env.py 里从环境变量 DATABASE_URL 读取,
# 并强制转成同步驱动 (psycopg), 避免误连错库。
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S