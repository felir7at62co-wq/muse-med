# Place inside the muse.aigc-pipeline.cn TLS server block, before the catch-all `location /`.
location = /console { proxy_pass http://127.0.0.1:19460; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
location ^~ /console/ { proxy_pass http://127.0.0.1:19460; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
