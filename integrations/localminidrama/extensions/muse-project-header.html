    <header class="header muse-project-header">
      <div class="header-inner">
        <div class="muse-project-heading"><h1>我的项目</h1><p>选一个故事，继续创作。</p></div>
        <div class="header-actions">
          <el-dropdown trigger="click" @command="museProjectCommand">
            <el-button>更多<el-icon class="el-icon--right"><ArrowDown /></el-icon></el-button>
            <template #dropdown>
              <el-dropdown-menu>
                <el-dropdown-item command="characters">角色素材库</el-dropdown-item>
                <el-dropdown-item command="scenes">场景素材库</el-dropdown-item>
                <el-dropdown-item command="props">道具素材库</el-dropdown-item>
                <el-dropdown-item command="media" divided>媒体素材</el-dropdown-item>
                <el-dropdown-item command="import" :disabled="importing">导入项目</el-dropdown-item>
                <el-dropdown-item command="models">原生模型设置</el-dropdown-item>
                <el-dropdown-item command="theme">{{ isDark ? '浅色外观' : '暗色外观' }}</el-dropdown-item>
              </el-dropdown-menu>
            </template>
          </el-dropdown>
          <input ref="importFileInput" type="file" accept=".zip" style="display:none" @change="onImportFile" />
          <el-button type="primary" @click="goNewProject"><el-icon><Plus /></el-icon>新建项目</el-button>
        </div>
      </div>
    </header>
